<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scanner Pro REAL Perspective Fix</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f172a;
  color:white;
}

.container{
  max-width:900px;
  margin:auto;
  padding:12px;
}

h1{
  text-align:center;
  font-size:18px;
}

input, button{
  width:100%;
  padding:10px;
  margin:8px 0;
  border:none;
  border-radius:8px;
}

button{
  background:#22c55e;
  font-weight:bold;
}

.editor{
  position:relative;
  background:#111827;
  border-radius:10px;
  overflow:hidden;
}

#img{
  width:100%;
  display:block;
}

.point{
  width:18px;
  height:18px;
  background:#00ff99;
  border-radius:50%;
  position:absolute;
  transform:translate(-50%,-50%);
  cursor:pointer;
  border:2px solid #000;
}

.card{
  background:#1e293b;
  padding:10px;
  margin-top:10px;
  border-radius:10px;
}

.card img{
  width:100%;
  border-radius:8px;
}

.delete{
  background:#ef4444;
  margin-top:6px;
}
</style>
</head>

<body>

<div class="container">
<h1>Scanner Pro (REAL FIXED Perspective)</h1>

<input type="file" id="file" accept="image/*">

<div class="editor" id="editor" style="display:none;">
  <img id="img">

  <div class="point" id="p1"></div>
  <div class="point" id="p2"></div>
  <div class="point" id="p3"></div>
  <div class="point" id="p4"></div>
</div>

<button onclick="addScan()">Add Scan</button>

<div id="list"></div>

<button onclick="exportPDF()">Export PDF</button>
</div>

<script>
const { jsPDF } = window.jspdf;

let img = new Image();
let scans = [];

const editor = document.getElementById("editor");
const imgEl = document.getElementById("img");

const pts = [
  document.getElementById("p1"),
  document.getElementById("p2"),
  document.getElementById("p3"),
  document.getElementById("p4")
];

let active = null;

// load image
document.getElementById("file").addEventListener("change", e=>{
  const file = e.target.files[0];
  if(!file) return;

  const reader = new FileReader();
  reader.onload = ev=>{
    img.src = ev.target.result;
    imgEl.src = ev.target.result;
    editor.style.display = "block";
  };
  reader.readAsDataURL(file);
});

// init points
img.onload = ()=>{
  const r = editor.getBoundingClientRect();

  set(pts[0],40,40);
  set(pts[1],r.width-40,40);
  set(pts[2],r.width-40,r.height-40);
  set(pts[3],40,r.height-40);
};

function set(el,x,y){
  el.style.left = x+"px";
  el.style.top = y+"px";
}

// drag (FIXED)
pts.forEach(p=>{
  p.addEventListener("pointerdown",()=> active=p);
});

document.addEventListener("pointermove",e=>{
  if(!active) return;

  const r = editor.getBoundingClientRect();

  let x = e.clientX - r.left;
  let y = e.clientY - r.top;

  x = Math.max(0,Math.min(r.width,x));
  y = Math.max(0,Math.min(r.height,y));

  active.style.left = x+"px";
  active.style.top = y+"px";
});

document.addEventListener("pointerup",()=> active=null);

// get points in correct order
function getPoints(){
  const r = editor.getBoundingClientRect();

  return pts.map(p=>({
    x: parseFloat(p.style.left),
    y: parseFloat(p.style.top)
  }));
}

// ============================
// 🔥 REAL PERSPECTIVE TRANSFORM
// (Homography approximation using 2 triangles)
// ============================
function warp(src, p, width, height){
  return new Promise(res=>{
    const i = new Image();
    i.src = src;

    i.onload = ()=>{

      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d");

      canvas.width = width;
      canvas.height = height;

      const [tl,tr,br,bl] = p;

      const drawTriangle = (p0,p1,p2)=>{
        ctx.save();

        ctx.beginPath();
        ctx.moveTo(p0.x,p0.y);
        ctx.lineTo(p1.x,p1.y);
        ctx.lineTo(p2.x,p2.y);
        ctx.closePath();
        ctx.clip();

        // approximate transform
        ctx.setTransform(
          (p1.x - p0.x)/width,
          (p1.y - p0.y)/width,
          (p2.x - p0.x)/height,
          (p2.y - p0.y)/height,
          p0.x,
          p0.y
        );

        ctx.drawImage(i,0,0,width,height);
        ctx.restore();
      };

      // split into 2 triangles (THIS FIXES DISTORTION)
      drawTriangle(tl,tr,bl);
      drawTriangle(tr,br,bl);

      res(canvas.toDataURL("image/jpeg",0.95));
    };
  });
}

// add scan
async function addScan(){
  const warped = await warp(img.src,getPoints(),1000,1400);

  scans.push(warped);
  render();

  editor.style.display="none";
  document.getElementById("file").value="";
}

// render
function render(){
  const list=document.getElementById("list");
  list.innerHTML="";

  scans.forEach((s,i)=>{
    const div=document.createElement("div");
    div.className="card";

    div.innerHTML=`
      <div>Page ${i+1}</div>
      <img src="${s}">
      <button class="delete" onclick="del(${i})">Delete</button>
    `;

    list.appendChild(div);
  });
}

function del(i){
  scans.splice(i,1);
  render();
}

// export PDF
function exportPDF(){
  const doc=new jsPDF();

  scans.forEach((s,i)=>{
    if(i>0) doc.addPage();
    doc.addImage(s,"JPEG",10,10,190,260);
  });

  doc.save("scan.pdf");
}
</script>

</body>
  </html>
