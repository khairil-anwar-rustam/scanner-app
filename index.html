<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scanner Ultra Pro AI FIXED+</title>

<style>
body{
margin:0;
font-family:Arial;
background:#0b1220;
color:white;
text-align:center;
}

header{
padding:12px;
background:#111a2e;
font-weight:bold;
}

#controls{
display:flex;
flex-wrap:wrap;
gap:8px;
justify-content:center;
padding:10px;
background:#0f172a;
}

button,input{
padding:10px;
border:0;
border-radius:8px;
font-weight:bold;
}

button{background:#22c55e;cursor:pointer;}

#editor{
position:relative;
height:60vh;
margin:10px;
background:black;
overflow:hidden;
border-radius:10px;
}

#img{
width:100%;
height:100%;
object-fit:contain;
}

#pages{
display:flex;
overflow-x:auto;
padding:10px;
}

.page{
width:80px;
height:100px;
object-fit:cover;
border:2px solid #22c55e;
margin:5px;
}

canvas{display:none;}
</style>
</head>

<body>

<header>📄 Scanner ULTRA PRO AI (1-CLICK AUTO SCAN)</header>

<div id="controls">
<input type="file" id="fileInput" accept="image/*">

<button onclick="oneClickScan()">🚀 One Click Auto Scan</button>
<button onclick="addPage()">Add Page</button>
<button onclick="exportPDF()">Export PDF</button>
<button onclick="runOCR()">OCR</button>
</div>

<div id="editor">
<img id="img">
</div>

<div id="pages"></div>
<canvas id="canvas"></canvas>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://docs.opencv.org/4.x/opencv.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<script>

let img = document.getElementById("img");
let fileInput = document.getElementById("fileInput");
let canvas = document.getElementById("canvas");
let ctx = canvas.getContext("2d");

let pages = [];
let cvReady = false;

/* OpenCV ready */
cv['onRuntimeInitialized'] = () => {
cvReady = true;
console.log("OpenCV READY ✔");
};

/* LOAD IMAGE */
fileInput.onchange = e=>{
let file = e.target.files[0];
let reader = new FileReader();

reader.onload = ev=>{
img.src = ev.target.result;
};

reader.readAsDataURL(file);
};

/* =========================
   🚀 ONE CLICK AUTO SCAN
========================= */
function oneClickScan(){

if(!cvReady){
alert("OpenCV still loading...");
return;
}

let src = cv.imread(img);
let gray = new cv.Mat();
let blur = new cv.Mat();
let edges = new cv.Mat();
let contours = new cv.MatVector();
let hierarchy = new cv.Mat();

cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
cv.GaussianBlur(gray, blur, new cv.Size(5,5), 0);
cv.Canny(blur, edges, 60, 180);

cv.findContours(edges, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

let best = null;
let maxArea = 0;

/* FIND DOCUMENT */
for(let i=0;i<contours.size();i++){
let cnt = contours.get(i);
let approx = new cv.Mat();

cv.approxPolyDP(cnt, approx, 0.02 * cv.arcLength(cnt, true), true);

if(approx.rows === 4){
let area = cv.contourArea(cnt);
if(area > maxArea){
maxArea = area;
best = approx;
}
}
}

/* fallback */
if(!best){
alert("No document found - try better lighting");
src.delete(); gray.delete(); blur.delete(); edges.delete();
contours.delete(); hierarchy.delete();
return;
}

let pts = best.data32S;

/* reorder points */
let p = [
{ x: pts[0], y: pts[1] },
{ x: pts[2], y: pts[3] },
{ x: pts[4], y: pts[5] },
{ x: pts[6], y: pts[7] }
];

p.sort((a,b)=>a.y-b.y);

let top = p.slice(0,2).sort((a,b)=>a.x-b.x);
let bottom = p.slice(2,4).sort((a,b)=>a.x-b.x);

let ordered = [
top[0],
top[1],
bottom[1],
bottom[0]
];

/* size */
let widthA = Math.hypot(ordered[2].x - ordered[3].x, ordered[2].y - ordered[3].y);
let widthB = Math.hypot(ordered[1].x - ordered[0].x, ordered[1].y - ordered[0].y);
let maxW = Math.max(widthA, widthB);

let heightA = Math.hypot(ordered[1].x - ordered[2].x, ordered[1].y - ordered[2].y);
let heightB = Math.hypot(ordered[0].x - ordered[3].x, ordered[0].y - ordered[3].y);
let maxH = Math.max(heightA, heightB);

/* transform */
let srcPts = cv.matFromArray(4,1,cv.CV_32FC2,[
ordered[0].x, ordered[0].y,
ordered[1].x, ordered[1].y,
ordered[2].x, ordered[2].y,
ordered[3].x, ordered[3].y
]);

let dstPts = cv.matFromArray(4,1,cv.CV_32FC2,[
0,0,
maxW,0,
maxW,maxH,
0,maxH
]);

let M = cv.getPerspectiveTransform(srcPts, dstPts);

let dst = new cv.Mat();
cv.warpPerspective(src, dst, M, new cv.Size(maxW,maxH));

cv.imshow(canvas, dst);

/* replace image */
img.src = canvas.toDataURL("image/jpeg", 1.0);

/* cleanup */
src.delete(); gray.delete(); blur.delete(); edges.delete();
contours.delete(); hierarchy.delete();
dst.delete(); M.delete();
srcPts.delete(); dstPts.delete();
best.delete();

alert("Auto Scan Done ✔ (Cropped + Straightened)");
}

/* ================= PAGE ================= */
function addPage(){
pages.push(img.src);
renderPages();
}

function renderPages(){
let box = document.getElementById("pages");
box.innerHTML = "";

pages.forEach(p=>{
let im = document.createElement("img");
im.src = p;
im.className = "page";
box.appendChild(im);
});
}

/* ================= OCR ================= */
async function runOCR(){
let result = await Tesseract.recognize(img.src,'eng');
alert(result.data.text);
}

/* ================= PDF EXPORT ================= */
async function exportPDF(){
const { jsPDF } = window.jspdf;
let pdf = new jsPDF();

let all = [img.src, ...pages];

for(let i=0;i<all.length;i++){
await new Promise(res=>{
let temp = new Image();
temp.src = all[i];

temp.onload = ()=>{
canvas.width = temp.width;
canvas.height = temp.height;
ctx.drawImage(temp,0,0);

let data = canvas.toDataURL("image/jpeg");

pdf.addImage(data,"JPEG",10,10,180,250);

if(i !== all.length-1) pdf.addPage();

res();
};
});
}

pdf.save("scan-ultra-pro.pdf");
}

</script>

</body>
  </html>
