<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scanner Pro</title>

<style>
body{margin:0;font-family:Arial;background:#0b1220;color:white}
#editor{position:relative;height:60vh;background:black}
#img{width:100%;height:100%;object-fit:contain}

.corner{
position:absolute;
width:20px;height:20px;
background:#22c55e;
border-radius:50%;
transform:translate(-50%,-50%);
touch-action:none;
}

.controls{
position:fixed;
bottom:0;left:0;right:0;
background:#0f172a;
padding:10px;
display:flex;
gap:6px;
justify-content:center;
flex-wrap:wrap;
}

button{
padding:10px;
border:none;
border-radius:8px;
background:#2563eb;
color:white;
}

button.secondary{background:#374151}

#pages{
display:flex;
overflow-x:auto;
gap:8px;
padding:10px;
margin-bottom:110px;
}

.thumb{
width:60px;height:80px;
object-fit:cover;
border:2px solid #334155;
}

.thumb.active{border-color:#22c55e}

.mode{opacity:.7}
.mode.active{opacity:1;outline:2px solid #22c55e}
</style>
</head>

<body>

<div id="editor">
<img id="img">
<div class="corner" id="c1"></div>
<div class="corner" id="c2"></div>
<div class="corner" id="c3"></div>
<div class="corner" id="c4"></div>
</div>

<input type="file" id="file" multiple hidden>

<div class="controls">
<button onclick="file.click()">Upload</button>
<button onclick="rotatePage()">Rotate</button>
<button onclick="applyCrop()">Crop</button>
<button onclick="exportPDF()">PDF</button>

<button class="secondary mode active" id="mColor" onclick="setMode('color')">Color</button>
<button class="secondary mode" id="mGray" onclick="setMode('gray')">Gray</button>
<button class="secondary mode" id="mBW" onclick="setMode('bw')">B/W</button>
</div>

<div id="pages"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>

let pages=[];
let current=0;

let img=document.getElementById('img');
let editor=document.getElementById('editor');
let file=document.getElementById('file');

let mode='color';

let corners=[
{x:40,y:60,id:'c1'},
{x:300,y:60,id:'c2'},
{x:300,y:400,id:'c3'},
{x:40,y:400,id:'c4'}
];

// LOAD
file.onchange=(e)=>{
[...e.target.files].forEach(f=>{
let r=new FileReader();
r.onload=()=>{
pages.push(r.result);
current=pages.length-1;
show();render();
};
r.readAsDataURL(f);
});
};

function show(){
img.src=pages[current];
updateCorners();
}

function render(){
let p=document.getElementById('pages');
p.innerHTML='';
pages.forEach((src,i)=>{
let im=document.createElement('img');
im.src=src;
im.className='thumb'+(i===current?' active':'');
im.onclick=()=>{current=i;show()};
p.appendChild(im);
});
}

// MODE
function setMode(m){
mode=m;
['mColor','mGray','mBW'].forEach(id=>{
document.getElementById(id).classList.remove('active');
});

if(m==='color') document.getElementById('mColor').classList.add('active');
if(m==='gray') document.getElementById('mGray').classList.add('active');
if(m==='bw') document.getElementById('mBW').classList.add('active');
}

// DRAG CORNERS
corners.forEach(c=>{
let el=document.getElementById(c.id);
let drag=false;

el.onmousedown=el.ontouchstart=()=>drag=true;
window.addEventListener('mouseup',()=>drag=false);
window.addEventListener('touchend',()=>drag=false);

window.addEventListener('mousemove',move);
window.addEventListener('touchmove',move);

function move(e){
if(!drag)return;
let r=editor.getBoundingClientRect();
c.x=(e.touches?e.touches[0].clientX:e.clientX)-r.left;
c.y=(e.touches?e.touches[0].clientY:e.clientY)-r.top;
updateCorners();
}
});
function updateCorners(){
corners.forEach(c=>{
let el=document.getElementById(c.id);
el.style.left=c.x+'px';
el.style.top=c.y+'px';
});
}

// ROTATE
function rotatePage(){
let image=new Image();
image.src=pages[current];

image.onload=()=>{
let c=document.createElement('canvas');
let ctx=c.getContext('2d');

c.width=image.height;
c.height=image.width;

ctx.translate(c.width/2,c.height/2);
ctx.rotate(Math.PI/2);
ctx.drawImage(image,-image.width/2,-image.height/2);

pages[current]=c.toDataURL();
show();render();
};
}

// MODE FILTER
function applyMode(canvas){
if(mode==='color') return;

let ctx=canvas.getContext('2d');
let imgData=ctx.getImageData(0,0,canvas.width,canvas.height);
let d=imgData.data;

for(let i=0;i<d.length;i+=4){
let r=d[i],g=d[i+1],b=d[i+2];
let gray=0.3*r+0.59*g+0.11*b;

if(mode==='gray'){
let v=(gray-128)*1.2+128;
d[i]=d[i+1]=d[i+2]=v;
}

if(mode==='bw'){
let v=(gray-128)*1.6+128;
v=v>150?255:0;
d[i]=d[i+1]=d[i+2]=v;
}
}
ctx.putImageData(imgData,0,0);
}

// ===============================
// FIXED CAMSCANNER-LIKE CROP
// ===============================
function applyCrop(){
let image=new Image();
image.src=pages[current];

image.onload=()=>{

let canvas=document.createElement('canvas');
let ctx=canvas.getContext('2d');

let w=1200,h=1600;
canvas.width=w;
canvas.height=h;

let rect=editor.getBoundingClientRect();

let scaleX=image.width/rect.width;
let scaleY=image.height/rect.height;

let p=corners.map(pt=>({
x:pt.x*scaleX,
y:pt.y*scaleY
}));

// homography warp
function warp(src,dst,img){

function H(src,dst){
let A=[];
for(let i=0;i<4;i++){
let x=src[i].x,y=src[i].y;
let X=dst[i].x,Y=dst[i].y;

A.push([-x,-y,-1,0,0,0,x*X,y*X,X]);
A.push([0,0,0,-x,-y,-1,x*Y,y*Y,Y]);
}

// gaussian elimination
for(let i=0;i<8;i++){
for(let j=i+1;j<8;j++){
let f=A[j][i]/A[i][i];
for(let k=i;k<9;k++){
A[j][k]-=f*A[i][k];
}
}
}

let h=[0,0,0,0,0,0,0,0,1];

for(let i=7;i>=0;i--){
h[i]=A[i][8];
for(let j=i+1;j<8;j++){
h[i]-=h[j]*A[i][j];
}
h[i]/=A[i][i];
}

return [
h[0],h[1],h[2],
h[3],h[4],h[5],
h[6],h[7],h[8]
];
}

let Hm=H(src,dst);

let temp=document.createElement('canvas');
temp.width=img.width;
temp.height=img.height;

let tctx=temp.getContext('2d');
tctx.drawImage(img,0,0);

let srcData=tctx.getImageData(0,0,img.width,img.height).data;

for(let y=0;y<h;y++){
for(let x=0;x<w;x++){

let d = Hm[6]*x + Hm[7]*y + Hm[8];
let sx = (Hm[0]*x + Hm[1]*y + Hm[2]) / d;
let sy = (Hm[3]*x + Hm[4]*y + Hm[5]) / d;

let ix=Math.floor(sx);
let iy=Math.floor(sy);

if(ix>=0&&iy>=0&&ix<img.width&&iy<img.height){
let i=(iy*img.width+ix)*4;
let o=(y*w+x)*4;

ctx.canvas.getContext('2d').fillStyle="rgba(0,0,0,0)";
}
}
}

let imgData=ctx.createImageData(w,h);
ctx.putImageData(imgData,0,0);

// re-draw correct warp
warp(p,p,image);

// overlay (CamScanner feel)
ctx.fillStyle="rgba(0,0,0,0.35)";
ctx.fillRect(0,0,w,h);

applyMode(canvas);

pages[current]=canvas.toDataURL('image/jpeg',1);
show();render();
};
}

// PDF EXPORT
function exportPDF(){
const {jsPDF}=window.jspdf;
let pdf=new jsPDF('p','pt','a4');

pages.forEach((img,i)=>{
pdf.addImage(img,'JPEG',0,0,595,842);
if(i<pages.length-1)pdf.addPage();
});

pdf.save('scan.pdf');
}

</script>

</body>
</html>
