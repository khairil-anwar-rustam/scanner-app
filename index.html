<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pro Scanner Crop</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
 body{
  margin:0;
  font-family:Arial;
  background:#0b1220;
  color:white;
  text-align:center;
}

.app{
  padding:15px;
  max-width:900px;
  margin:auto;
}

.editor{
  position:relative;
  margin-top:15px;
  height:65vh;
  background:#000;
  overflow:hidden;
  border-radius:12px;
}

#image{
  width:100%;
  height:100%;
  object-fit:contain;
}

/* crop corners */
.corner{
  width:18px;
  height:18px;
  background:#22c55e;
  border:2px solid #fff;
  border-radius:50%;
  position:absolute;
  touch-action:none;
}

.tl{ left:10%; top:10%; }
.tr{ right:10%; top:10%; }
.bl{ left:10%; bottom:10%; }
.br{ right:10%; bottom:10%; }

button{
  margin-top:15px;
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  background:#22c55e;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="app">
  <h2>Pro Scanner Crop Tool</h2>

  <input type="file" id="fileInput" accept="image/*">

  <div class="editor" id="editor">
    <img id="image" />
    
    <!-- crop corners -->
    <div class="corner tl" id="tl"></div>
    <div class="corner tr" id="tr"></div>
    <div class="corner bl" id="bl"></div>
    <div class="corner br" id="br"></div>
  </div>

  <button onclick="exportPDF()">Export PDF</button>
</div>

<script>
 const { jsPDF } = window.jspdf;

const img = document.getElementById("image");
const editor = document.getElementById("editor");

const corners = {
  tl: document.getElementById("tl"),
  tr: document.getElementById("tr"),
  bl: document.getElementById("bl"),
  br: document.getElementById("br")
};

let activeCorner = null;
let imgLoaded = false;

// upload image
document.getElementById("fileInput").addEventListener("change", e => {
  const file = e.target.files[0];
  if(!file) return;

  const reader = new FileReader();
  reader.onload = ev => {
    img.src = ev.target.result;
    imgLoaded = true;
  };
  reader.readAsDataURL(file);
});

// drag corners
Object.keys(corners).forEach(key => {
  const el = corners[key];

  el.addEventListener("pointerdown", () => {
    activeCorner = key;
  });
});

document.addEventListener("pointermove", (e) => {
  if(!activeCorner || !imgLoaded) return;

  const rect = editor.getBoundingClientRect();

  let x = ((e.clientX - rect.left) / rect.width) * 100;
  let y = ((e.clientY - rect.top) / rect.height) * 100;

  x = Math.max(0, Math.min(100, x));
  y = Math.max(0, Math.min(100, y));

  const el = corners[activeCorner];
  el.style.left = x + "%";
  el.style.top = y + "%";
});

document.addEventListener("pointerup", () => {
  activeCorner = null;
});

// export PDF with crop
async function exportPDF(){
  if(!imgLoaded) return alert("Upload image first");

  const canvas = document.createElement("canvas");
  const ctx = canvas.getContext("2d");

  const image = new Image();
  image.src = img.src;

  await new Promise(r => image.onload = r);

  canvas.width = image.width;
  canvas.height = image.height;

  // get points
  const rect = editor.getBoundingClientRect();

  function getPoint(el){
    const r = el.getBoundingClientRect();
    return {
      x: (r.left - rect.left) / rect.width * image.width,
      y: (r.top - rect.top) / rect.height * image.height
    };
  }

  const tl = getPoint(corners.tl);
  const tr = getPoint(corners.tr);
  const bl = getPoint(corners.bl);
  const br = getPoint(corners.br);

  // simple clip crop (triangle method approximation)
  ctx.save();

  ctx.beginPath();
  ctx.moveTo(tl.x, tl.y);
  ctx.lineTo(tr.x, tr.y);
  ctx.lineTo(br.x, br.y);
  ctx.lineTo(bl.x, bl.y);
  ctx.closePath();
  ctx.clip();

  ctx.drawImage(image, 0, 0);

  ctx.restore();

  const pdf = new jsPDF();
  const imgData = canvas.toDataURL("image/jpeg", 0.95);

  pdf.addImage(imgData, "JPEG", 10, 10, 190, 250);
  pdf.save("scanned.pdf");
 }
</script>
</body>
</html>
