<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Scanner AI Pro MAX</title>

<!-- PWA CORE -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b1220">

<style>
*{box-sizing:border-box;}
body{margin:0;font-family:Arial;background:#0b1220;color:white;overflow:hidden;}
header{padding:10px;background:#111827;text-align:center;font-size:16px;}

.container{position:relative;width:100vw;height:55vh;background:black;overflow:hidden;}
video{width:100%;height:100%;object-fit:cover;}
canvas#overlay{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;}

.controls{
position:fixed;bottom:0;left:0;right:0;
padding:10px;
background:#0f172a;
display:flex;flex-wrap:wrap;justify-content:center;gap:6px;
padding-bottom:calc(10px + env(safe-area-inset-bottom));
}

button{
padding:10px 12px;border:none;border-radius:10px;
background:#2563eb;color:white;font-size:14px;
}
button:active{transform:scale(0.97);}

#pages{display:flex;overflow-x:auto;gap:8px;padding:10px;margin-bottom:90px;}
.page-thumb{width:55px;height:75px;object-fit:cover;border:2px solid #334155;border-radius:6px;flex-shrink:0;}
.page-thumb.active{border-color:#22c55e;}

#ocrBox{padding:10px;font-size:12px;background:#0f172a;white-space:pre-wrap;}
</style>
</head>
<body>

<header>📱 Scanner AI Pro MAX (PWA OFFLINE)</header>

<div class="container">
<video id="video" autoplay playsinline></video>
<canvas id="overlay"></canvas>
</div>

<input type="file" id="file" multiple accept="image/*" hidden onchange="handleUpload(event)">

<div class="controls">
<button onclick="startCamera()">📷 Camera</button>
<button onclick="openGallery()">🖼 Gallery</button>
<button onclick="toggleAuto()">🤖 Auto</button>
<button onclick="runOCR()">🧠 OCR</button>
<button onclick="exportPDF()">⬇ PDF</button>
</div>

<h3 style="text-align:center">Pages</h3>
<div id="pages"></div>
<div id="ocrBox">OCR Output: (empty)</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://docs.opencv.org/4.x/opencv.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<script>
let video=document.getElementById('video');
let overlay=document.getElementById('overlay');
let ctx=overlay.getContext('2d');

let pages=[];
let current=0;
let autoMode=false;
let lastCapture=0;

// CAMERA
function startCamera(){
navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}})
.then(s=>video.srcObject=s);
loop();
}

function toggleAuto(){autoMode=!autoMode;alert("Auto: "+autoMode);}

function loop(){
resize();
ctx.clearRect(0,0,overlay.width,overlay.height);

let detected=detectDoc();

if(detected){
ctx.strokeStyle="lime";
ctx.strokeRect(30,50,overlay.width-60,overlay.height-100);

if(autoMode && Date.now()-lastCapture>2500){capture();lastCapture=Date.now();}
}

requestAnimationFrame(loop);
}

function resize(){overlay.width=video.clientWidth;overlay.height=video.clientHeight;}

// SIMPLE DETECTION
function detectDoc(){
try{
let c=document.createElement("canvas");
c.width=video.videoWidth;c.height=video.videoHeight;
c.getContext("2d").drawImage(video,0,0);
let src=cv.imread(c);
let gray=new cv.Mat();let blur=new cv.Mat();let edges=new cv.Mat();
cv.cvtColor(src,gray,cv.COLOR_RGBA2GRAY);
cv.GaussianBlur(gray,blur,new cv.Size(5,5),0);
cv.Canny(blur,edges,75,200);
let cnt=new cv.MatVector();let h=new cv.Mat();
cv.findContours(edges,cnt,h,cv.RETR_EXTERNAL,cv.CHAIN_APPROX_SIMPLE);
let ok=cnt.size()>0;
src.delete();gray.delete();blur.delete();edges.delete();cnt.delete();h.delete();
return ok;
}catch(e){return false;}
}

// CAPTURE
function capture(){
let c=document.createElement("canvas");
c.width=video.videoWidth;c.height=video.videoHeight;
c.getContext("2d").drawImage(video,0,0);
pages.push(c.toDataURL());
current=pages.length-1;
renderPages();
}

// GALLERY
function openGallery(){document.getElementById("file").click();}
function handleUpload(e){[...e.target.files].forEach(f=>{let r=new FileReader();r.onload=()=>{pages.push(r.result);renderPages();};r.readAsDataURL(f);});}

// OCR
function runOCR(){
if(!pages[current])return;
Tesseract.recognize(pages[current],'eng').then(({data})=>{
document.getElementById("ocrBox").innerText=data.text;
});
}

// PAGES
function renderPages(){
let p=document.getElementById("pages");p.innerHTML="";
pages.forEach((img,i)=>{
let im=document.createElement("img");im.src=img;
im.className="page-thumb"+(i===current?" active":"");
im.onclick=()=>current=i;
p.appendChild(im);
});
}

// PDF
function exportPDF(){const {jsPDF}=window.jspdf;let pdf=new jsPDF();pages.forEach((img,i)=>{if(i>0)pdf.addPage();pdf.addImage(img,'PNG',10,10,180,160);});pdf.save("scan.pdf");}
</script>

<!-- ================= PWA SERVICE WORKER ================= -->
<script>
if('serviceWorker' in navigator){
window.addEventListener('load',()=>{
navigator.serviceWorker.register('sw.js')
.then(()=>console.log('SW registered'))
.catch(err=>console.log(err));
});
}
</script>

</body>
</html>

});

self.addEventListener("fetch",e=>{
e.respondWith(
caches.match(e.request).then(r=>r||fetch(e.request))
);
