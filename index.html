<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Scanner Pro</title>


<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  *{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  font-family:Arial;
  background:#0f172a;
  color:white;
}

header{
  padding:16px;
  text-align:center;
  font-size:22px;
  font-weight:bold;
  background:#111827;
  position:sticky;
  top:0;
}

.container{
  max-width:900px;
  margin:auto;
  padding:15px;
}

.card{
  background:#1e293b;
  padding:14px;
  border-radius:16px;
  margin-bottom:15px;
}

input,select,button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:10px;
  font-size:16px;
}

input,select{
  background:#0f172a;
  color:white;
}

button{
  background:#22c55e;
  font-weight:bold;
  color:black;
}

button:active{
  transform:scale(0.98);
}

.danger{
  background:#ef4444;
  color:white;
}

#editor{
  margin-top:15px;
  background:black;
  height:55vh;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  border-radius:12px;
}

#previewImage{
  width:100%;
  height:100%;
  object-fit:contain;
}

.receipt-list{
  margin-top:15px;
}

.item{
  background:#111827;
  padding:10px;
  border-radius:12px;
  margin-bottom:10px;
}

.item img{
  width:100%;
  border-radius:10px;
}

.total{
  text-align:right;
  font-size:18px;
  font-weight:bold;
  margin:10px 0;
}

.row{
  display:flex;
  gap:10px;
  }
</style>
  
</head>

<body>

<header>Scanner Pro</header>

<div class="container">

<div class="card">

<input type="date" id="date">
<input type="text" id="purpose" placeholder="Document Name">

<select id="filterMode">
  <option value="original">Original</option>
  <option value="bw">Black & White</option>
  <option value="gray">Grayscale</option>
  <option value="enhance">Enhanced</option>
</select>

<input type="file" id="fileInput" accept="image/*" capture="environment">

<div id="editor">
  <img id="previewImage">
</div>

<div class="row">
<button onclick="saveScan()">Save Scan</button>
<button class="danger" onclick="resetEditor()">Reset</button>
</div>

</div>

<div class="total" id="totalAmount">Scans: 0</div>

<div class="receipt-list" id="receiptList"></div>

<button onclick="generatePDF()">Export PDF</button>

</div>

<canvas id="canvas"></canvas>

<script>
  const { jsPDF } = window.jspdf;

const fileInput = document.getElementById("fileInput");
const previewImage = document.getElementById("previewImage");

let scans = [];
let currentImage = null;

fileInput.addEventListener("change", (e) => {
  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();

  reader.onload = (ev) => {
    currentImage = ev.target.result;
    previewImage.src = currentImage;
  };

  reader.readAsDataURL(file);
});

function saveScan() {
  const name = document.getElementById("purpose").value;

  if (!currentImage) {
    alert("Select image first");
    return;
  }

  if (!name) {
    alert("Enter document name");
    return;
  }

  scans.push({
    name,
    image: currentImage
  });

  render();
}

function render() {
  const list = document.getElementById("receiptList");
  list.innerHTML = "";

  scans.forEach((s, i) => {
    const div = document.createElement("div");
    div.className = "item";

    div.innerHTML = `
      <b>${s.name}</b>
      <img src="${s.image}">
      <button class="danger" onclick="deleteScan(${i})">Delete</button>
    `;

    list.appendChild(div);
  });

  document.getElementById("totalAmount").innerText =
    "Scans: " + scans.length;
}

function deleteScan(i) {
  scans.splice(i, 1);
  render();
}

function resetEditor() {
  fileInput.value = "";
  previewImage.src = "";
  currentImage = null;
}

async function generatePDF() {
  if (scans.length === 0) {
    alert("No scans");
    return;
  }

  const doc = new jsPDF();

  for (let i = 0; i < scans.length; i++) {
    if (i !== 0) doc.addPage();

    doc.text(scans[i].name, 10, 10);
    doc.addImage(scans[i].image, "JPEG", 10, 20, 180, 160);
  }

  doc.save("scans.pdf");
  }
</script>

</body>
  </html>
