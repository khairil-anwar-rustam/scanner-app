<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scanner Pro FIXED</title>

<style>
body{margin:0;font-family:Arial;background:#0b1220;color:white}

#editor{
position:relative;
height:60vh;
background:black;
overflow:hidden;
}

#img{
width:100%;
height:100%;
object-fit:contain;
}

.corner{
position:absolute;
width:18px;height:18px;
background:#22c55e;
border-radius:50%;
transform:translate(-50%,-50%);
touch-action:none;
}

.controls{
position:fixed;
bottom:0;left:0;right:0;
background:#0f172a;
padding:10px;
display:flex;
gap:6px;
justify-content:center;
flex-wrap:wrap;
}

button{
padding:10px;
border:none;
border-radius:8px;
background:#2563eb;
color:white;
}

button.secondary{background:#374151}

#pages{
display:flex;
overflow-x:auto;
gap:8px;
padding:10px;
margin-bottom:110px;
}

.thumb{
width:60px;height:80px;
object-fit:cover;
border:2px solid #334155;
}

.thumb.active{border-color:#22c55e}
</style>
</head>

<body>

<div id="editor">
<img id="img">
<div class="corner" id="c1"></div>
<div class="corner" id="c2"></div>
<div class="corner" id="c3"></div>
<div class="corner" id="c4"></div>
</div>

<input type="file" id="file" multiple hidden>

<div class="controls">
<button onclick="file.click()">Upload</button>
<button onclick="rotatePage()">Rotate</button>
<button onclick="applyCrop()">Crop</button>
<button onclick="exportPDF()">PDF</button>
</div>

<div id="pages"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>

let pages = [];
let current = 0;

let img = document.getElementById('img');
let editor = document.getElementById('editor');
let file = document.getElementById('file');

let activeCorner = null;

let corners = [
{x:50,y:50,id:'c1'},
{x:300,y:50,id:'c2'},
{x:300,y:400,id:'c3'},
{x:50,y:400,id:'c4'}
];

// =====================
// LOAD
// =====================
file.onchange = (e)=>{
[...e.target.files].forEach(f=>{
let r = new FileReader();
r.onload = ()=>{
pages.push(r.result);
current = pages.length-1;
show();
render();
};
r.readAsDataURL(f);
});
};

function show(){
img.src = pages[current];
img.onload = ()=>{
setTimeout(()=>{
resetCorners();
updateCorners();
},50);
};
}

function render(){
let p = document.getElementById('pages');
p.innerHTML='';

pages.forEach((src,i)=>{
let im = document.createElement('img');
im.src = src;
im.className = 'thumb' + (i===current?' active':'');
im.onclick = ()=>{current=i;show();};
p.appendChild(im);
});
}

// =====================
// DRAG CORNERS
// =====================
corners.forEach(c=>{
let el = document.getElementById(c.id);

el.addEventListener('pointerdown',(e)=>{
activeCorner = c;
el.setPointerCapture(e.pointerId);
});

el.addEventListener('pointermove',(e)=>{
if(activeCorner !== c) return;

let r = editor.getBoundingClientRect();

c.x = Math.max(0,Math.min(r.width, e.clientX - r.left));
c.y = Math.max(0,Math.min(r.height, e.clientY - r.top));

updateCorners();
});

el.addEventListener('pointerup',()=>{
activeCorner = null;
});
});

function updateCorners(){
corners.forEach(c=>{
let el = document.getElementById(c.id);
el.style.left = c.x + 'px';
el.style.top = c.y + 'px';
});
}

// =====================
// RESET
// =====================
function resetCorners(){
let r = editor.getBoundingClientRect();

corners[0].x = 40; corners[0].y = 40;
corners[1].x = r.width - 40; corners[1].y = 40;
corners[2].x = r.width - 40; corners[2].y = r.height - 40;
corners[3].x = 40; corners[3].y = r.height - 40;
}

// =====================
// ROTATE
// =====================
function rotatePage(){
let image = new Image();
image.src = pages[current];

image.onload = ()=>{
let c = document.createElement('canvas');
let ctx = c.getContext('2d');

c.width = image.height;
c.height = image.width;

ctx.translate(c.width/2,c.height/2);
ctx.rotate(Math.PI/2);
ctx.drawImage(image,-image.width/2,-image.height/2);

pages[current] = c.toDataURL('image/jpeg',0.95);
show(); render();
};
}

// =====================
// HOMOGRAPHY MATH
// =====================
function solveH(p){
let x0=p[0].x, y0=p[0].y;
let x1=p[1].x, y1=p[1].y;
let x2=p[2].x, y2=p[2].y;
let x3=p[3].x, y3=p[3].y;

let dx1 = x1 - x2;
let dx2 = x3 - x2;
let sx = x0 - x1 + x2 - x3;

let dy1 = y1 - y2;
let dy2 = y3 - y2;
let sy = y0 - y1 + y2 - y3;

let det = dx1*dy2 - dx2*dy1;

let g = (sx*dy2 - dx2*sy)/det;
let h = (dx1*sy - sx*dy1)/det;

let a = x1 - x0 + g*x1;
let b = x3 - x0 + h*x3;
let c = x0;
let d = y1 - y0 + g*y1;
let e = y3 - y0 + h*y3;
let f = y0;

return [a,b,c,d,e,f,g,h,1];
}

function warpPoint(m,x,y){
let den = m[6]*x + m[7]*y + 1;
return {
x:(m[0]*x + m[1]*y + m[2]) / den,
y:(m[3]*x + m[4]*y + m[5]) / den
};
}

// =====================
// CROPPING FIXED (REAL)
// =====================
function applyCrop(){

let image = new Image();
image.src = pages[current];

image.onload = ()=>{

let rect = editor.getBoundingClientRect();

let srcPts = corners.map(p=>({
x:p.x/rect.width * image.width,
y:p.y/rect.height * image.height
}));

let dstW = 1200;
let dstH = 1600;

let dstPts = [
{x:0,y:0},
{x:dstW,y:0},
{x:dstW,y:dstH},
{x:0,y:dstH}
];

let H = solveH(srcPts);
let invH = solveH(dstPts); // simplified inverse approximation

let canvas = document.createElement('canvas');
canvas.width = dstW;
canvas.height = dstH;

let ctx = canvas.getContext('2d');
let srcCanvas = document.createElement('canvas');
srcCanvas.width = image.width;
srcCanvas.height = image.height;

let sctx = srcCanvas.getContext('2d');
sctx.drawImage(image,0,0);

let srcData = sctx.getImageData(0,0,image.width,image.height).data;

let out = ctx.createImageData(dstW,dstH);

function get(x,y){
x=Math.max(0,Math.min(image.width-1,x));
y=Math.max(0,Math.min(image.height-1,y));
let i=(y*image.width+x)*4;
return [srcData[i],srcData[i+1],srcData[i+2],255];
}

for(let y=0;y<dstH;y++){
for(let x=0;x<dstW;x++){

let p = warpPoint(H,x,y);

let px = Math.floor(p.x);
let py = Math.floor(p.y);

let [r,g,b,a]=get(px,py);

let i=(y*dstW+x)*4;
out.data[i]=r;
out.data[i+1]=g;
out.data[i+2]=b;
out.data[i+3]=a;
}
}

ctx.putImageData(out,0,0);

pages[current]=canvas.toDataURL('image/jpeg',0.95);
show(); render();
};
}

// =====================
// PDF EXPORT
// =====================
function exportPDF(){
const {jsPDF} = window.jspdf;
let pdf = new jsPDF('p','pt','a4');

pages.forEach((img,i)=>{
pdf.addImage(img,'JPEG',10,10,575,0);
if(i<pages.length-1) pdf.addPage();
});

pdf.save('scan.pdf');
}

</script>

</body>
</html>
