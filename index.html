<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pro Scanner Ultra (Fixed Perspective)</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0b1220;
  color:white;
  text-align:center;
}

.app{
  padding:15px;
  max-width:900px;
  margin:auto;
}

.editor{
  position:relative;
  margin-top:15px;
  height:65vh;
  background:#000;
  overflow:hidden;
  border-radius:12px;
}

#image{
  width:100%;
  height:100%;
  object-fit:contain;
  user-select:none;
  pointer-events:none;
}

/* corner points */
.corner{
  width:22px;
  height:22px;
  background:#22c55e;
  border:2px solid #fff;
  border-radius:50%;
  position:absolute;
  touch-action:none;
}

button{
  margin-top:15px;
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  background:#22c55e;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="app">
  <h2>Pro Scanner Ultra (Perspective FIX)</h2>

  <input type="file" id="fileInput" accept="image/*">

  <div class="editor" id="editor">
    <img id="image">

    <div class="corner" id="tl"></div>
    <div class="corner" id="tr"></div>
    <div class="corner" id="bl"></div>
    <div class="corner" id="br"></div>
  </div>

  <button onclick="exportPDF()">Export PDF</button>
</div>

<script>
const { jsPDF } = window.jspdf;

const img = document.getElementById("image");
const editor = document.getElementById("editor");

const corners = {
  tl: document.getElementById("tl"),
  tr: document.getElementById("tr"),
  bl: document.getElementById("bl"),
  br: document.getElementById("br")
};

let active = null;
let imgLoaded = false;

// init default positions
function resetCorners(){
  corners.tl.style.left = "10%";
  corners.tl.style.top = "10%";

  corners.tr.style.left = "90%";
  corners.tr.style.top = "10%";

  corners.bl.style.left = "10%";
  corners.bl.style.top = "90%";

  corners.br.style.left = "90%";
  corners.br.style.top = "90%";
}

resetCorners();

// upload
document.getElementById("fileInput").addEventListener("change", e=>{
  const file = e.target.files[0];
  if(!file) return;

  const reader = new FileReader();
  reader.onload = ev=>{
    img.src = ev.target.result;
    imgLoaded = true;
  };
  reader.readAsDataURL(file);
});

// drag
Object.keys(corners).forEach(k=>{
  corners[k].addEventListener("pointerdown", ()=> active = k);
});

document.addEventListener("pointermove", e=>{
  if(!active || !imgLoaded) return;

  const rect = editor.getBoundingClientRect();

  let x = (e.clientX - rect.left) / rect.width * 100;
  let y = (e.clientY - rect.top) / rect.height * 100;

  x = Math.max(0, Math.min(100, x));
  y = Math.max(0, Math.min(100, y));

  corners[active].style.left = x + "%";
  corners[active].style.top = y + "%";
});

document.addEventListener("pointerup", ()=> active=null);

// ====== REAL PERSPECTIVE TRANSFORM ======

function getPos(el, rect, imgW, imgH){
  const r = el.getBoundingClientRect();
  return {
    x: (r.left - rect.left) / rect.width * imgW,
    y: (r.top - rect.top) / rect.height * imgH
  };
}

// bilinear transform (core CamScanner logic)
function warpImage(ctx, img, src, dst, w, h){
  const tmp = document.createElement("canvas");
  tmp.width = w;
  tmp.height = h;
  const tctx = tmp.getContext("2d");

  tctx.drawImage(img, 0, 0, w, h);
  const srcData = tctx.getImageData(0,0,w,h);

  const out = ctx.createImageData(w,h);

  function lerp(a,b,t){ return a + (b-a)*t; }

  // simple approximation warp (fast + mobile friendly)
  for(let y=0;y<h;y++){
    for(let x=0;x<w;x++){

      const u = x / w;
      const v = y / h;

      // interpolate quadrilateral
      const topX = lerp(dst.tl.x, dst.tr.x, u);
      const topY = lerp(dst.tl.y, dst.tr.y, u);

      const botX = lerp(dst.bl.x, dst.br.x, u);
      const botY = lerp(dst.bl.y, dst.br.y, u);

      const srcX = lerp(topX, botX, v);
      const srcY = lerp(topY, botY, v);

      const sx = Math.floor(srcX);
      const sy = Math.floor(srcY);

      const i = (sy*w + sx) * 4;
      const o = (y*w + x) * 4;

      out.data[o] = srcData.data[i] || 0;
      out.data[o+1] = srcData.data[i+1] || 0;
      out.data[o+2] = srcData.data[i+2] || 0;
      out.data[o+3] = 255;
    }
  }

  ctx.putImageData(out,0,0);
}

// export
async function exportPDF(){
  if(!imgLoaded) return alert("Upload image first");

  const image = new Image();
  image.src = img.src;
  await new Promise(r=>image.onload=r);

  const canvas = document.createElement("canvas");
  const ctx = canvas.getContext("2d");

  canvas.width = 1000;
  canvas.height = 1400;

  const rect = editor.getBoundingClientRect();

  const tl = getPos(corners.tl, rect, image.width, image.height);
  const tr = getPos(corners.tr, rect, image.width, image.height);
  const bl = getPos(corners.bl, rect, image.width, image.height);
  const br = getPos(corners.br, rect, image.width, image.height);

  warpImage(ctx, image, image, {tl,tr,bl,br}, canvas.width, canvas.height);

  const pdf = new jsPDF("p","mm","a4");
  const imgData = canvas.toDataURL("image/jpeg", 1.0);

  pdf.addImage(imgData, "JPEG", 10, 10, 190, 270);
  pdf.save("scan.pdf");
}
</script>

</body>
</html>
