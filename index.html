<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scanner Pro FIX</title>

<style>
body{margin:0;font-family:Arial;background:#0b1220;color:white}

#editor{
position:relative;
height:60vh;
background:black;
overflow:hidden;
}

#img{
width:100%;
height:100%;
object-fit:contain;
}

.corner{
position:absolute;
width:18px;height:18px;
background:#22c55e;
border-radius:50%;
transform:translate(-50%,-50%);
touch-action:none;
}

.controls{
position:fixed;
bottom:0;left:0;right:0;
background:#0f172a;
padding:10px;
display:flex;
gap:6px;
justify-content:center;
flex-wrap:wrap;
}

button{
padding:10px;
border:none;
border-radius:8px;
background:#2563eb;
color:white;
}

button.secondary{background:#374151}

#pages{
display:flex;
overflow-x:auto;
gap:8px;
padding:10px;
margin-bottom:110px;
}

.thumb{
width:60px;height:80px;
object-fit:cover;
border:2px solid #334155;
}

.thumb.active{border-color:#22c55e}
</style>
</head>

<body>

<div id="editor">
<img id="img">
<div class="corner" id="c1"></div>
<div class="corner" id="c2"></div>
<div class="corner" id="c3"></div>
<div class="corner" id="c4"></div>
</div>

<input type="file" id="file" multiple hidden>

<div class="controls">
<button onclick="file.click()">Upload</button>
<button onclick="rotatePage()">Rotate</button>
<button onclick="applyCrop()">Crop</button>
<button onclick="exportPDF()">PDF</button>
</div>

<div id="pages"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>

let pages = [];
let current = 0;

let img = document.getElementById('img');
let editor = document.getElementById('editor');
let file = document.getElementById('file');

let activeCorner = null;

// IMPORTANT: keep same object references (DO NOT reassign array items)
let corners = [
{x:50,y:50,id:'c1'},
{x:300,y:50,id:'c2'},
{x:300,y:400,id:'c3'},
{x:50,y:400,id:'c4'}
];

// =====================
// LOAD
// =====================
file.onchange = (e)=>{
[...e.target.files].forEach(f=>{
let r = new FileReader();
r.onload = ()=>{
pages.push(r.result);
current = pages.length-1;
show();
render();
};
r.readAsDataURL(f);
});
};

function show(){
img.src = pages[current];
img.onload = ()=>{
setTimeout(()=>{
resetCorners();
updateCorners();
},50);
};
}

function render(){
let p = document.getElementById('pages');
p.innerHTML='';

pages.forEach((src,i)=>{
let im = document.createElement('img');
im.src = src;
im.className = 'thumb' + (i===current?' active':'');
im.onclick = ()=>{current=i;show();};
p.appendChild(im);
});
}

// =====================
// DRAG CORNERS FIXED
// =====================
corners.forEach(c=>{
let el = document.getElementById(c.id);

el.addEventListener('pointerdown',(e)=>{
activeCorner = c;
el.setPointerCapture(e.pointerId);
});

el.addEventListener('pointermove',(e)=>{
if(activeCorner !== c) return;

let r = editor.getBoundingClientRect();

c.x = Math.max(0,Math.min(r.width, e.clientX - r.left));
c.y = Math.max(0,Math.min(r.height, e.clientY - r.top));

updateCorners();
});

el.addEventListener('pointerup',()=>{
activeCorner = null;
});
});

function updateCorners(){
corners.forEach(c=>{
let el = document.getElementById(c.id);
el.style.left = c.x + 'px';
el.style.top = c.y + 'px';
});
}

// =====================
// FIXED RESET (NO REASSIGNMENT BUG)
// =====================
function resetCorners(){
let r = editor.getBoundingClientRect();

corners[0].x = 40; corners[0].y = 40;
corners[1].x = r.width - 40; corners[1].y = 40;
corners[2].x = r.width - 40; corners[2].y = r.height - 40;
corners[3].x = 40; corners[3].y = r.height - 40;
}

// =====================
// ROTATE
// =====================
function rotatePage(){
let image = new Image();
image.src = pages[current];

image.onload = ()=>{
let c = document.createElement('canvas');
let ctx = c.getContext('2d');

c.width = image.height;
c.height = image.width;

ctx.translate(c.width/2,c.height/2);
ctx.rotate(Math.PI/2);
ctx.drawImage(image,-image.width/2,-image.height/2);

pages[current] = c.toDataURL('image/jpeg',0.95);
show(); render();
};
}

// =====================
// CROPPING (IMPROVED)
// =====================
function applyCrop(){

let image = new Image();
image.src = pages[current];

image.onload = ()=>{

let W = 1200, H = 1600;
let canvas = document.createElement('canvas');
let ctx = canvas.getContext('2d');

canvas.width = W;
canvas.height = H;

let rect = editor.getBoundingClientRect();

let sx = image.width / rect.width;
let sy = image.height / rect.height;

let src = corners.map(p=>({
x:p.x * sx,
y:p.y * sy
}));

let temp = document.createElement('canvas');
temp.width = image.width;
temp.height = image.height;

let tctx = temp.getContext('2d');
tctx.drawImage(image,0,0);

let srcData = tctx.getImageData(0,0,image.width,image.height).data;

let out = ctx.createImageData(W,H);

// bilinear sampling (FIXED)
function getPixel(x,y){
let i = (y*image.width + x)*4;
return [
srcData[i]||0,
srcData[i+1]||0,
srcData[i+2]||0,
255
];
}

for(let y=0;y<H;y++){
for(let x=0;x<W;x++){

let u = x/W;
let v = y/H;

let px =
src[0].x*(1-u)*(1-v) +
src[1].x*u*(1-v) +
src[2].x*u*v +
src[3].x*(1-u)*v;

let py =
src[0].y*(1-u)*(1-v) +
src[1].y*u*(1-v) +
src[2].y*u*v +
src[3].y*(1-u)*v;

let ix = Math.max(0,Math.min(image.width-1, px|0));
let iy = Math.max(0,Math.min(image.height-1, py|0));

let [r,g,b,a] = getPixel(ix,iy);

let o = (y*W + x)*4;
out.data[o]=r;
out.data[o+1]=g;
out.data[o+2]=b;
out.data[o+3]=a;
}
}

ctx.putImageData(out,0,0);

pages[current] = canvas.toDataURL('image/jpeg',0.95);
show(); render();
};
}

// =====================
// PDF EXPORT
// =====================
function exportPDF(){
const {jsPDF} = window.jspdf;
let pdf = new jsPDF('p','pt','a4');

pages.forEach((img,i)=>{
pdf.addImage(img,'JPEG',0,0,595,842);
if(i<pages.length-1) pdf.addPage();
});

pdf.save('scan.pdf');
}

</script>

</body>
  </html>
