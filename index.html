<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CamScanner Style Crop</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f172a;
  color:white;
}

.container{
  max-width:900px;
  margin:auto;
  padding:12px;
}

h1{
  text-align:center;
  font-size:18px;
}

input, button{
  width:100%;
  padding:10px;
  margin:8px 0;
  border:none;
  border-radius:8px;
}

button{
  background:#22c55e;
  font-weight:bold;
}

.editor{
  position:relative;
  background:#111827;
  border-radius:10px;
  overflow:hidden;
  display:none;
}

#img{
  width:100%;
  display:block;
}

.crop-box{
  position:absolute;
  border:2px dashed #00ff99;
  width:200px;
  height:200px;
  top:50px;
  left:50px;
  cursor:move;
  touch-action:none;
}

.handle{
  width:14px;
  height:14px;
  background:#00ff99;
  position:absolute;
  border-radius:50%;
}

.tl{top:-7px;left:-7px;}
.tr{top:-7px;right:-7px;}
.bl{bottom:-7px;left:-7px;}
.br{bottom:-7px;right:-7px;}

.card{
  background:#1e293b;
  padding:10px;
  margin-top:10px;
  border-radius:10px;
}

.card img{
  width:100%;
  border-radius:8px;
}

.delete{
  background:#ef4444;
  margin-top:6px;
}
</style>
</head>

<body>

<div class="container">
<h1>CamScanner Style Crop</h1>

<input type="file" id="file" accept="image/*">

<div class="editor" id="editor">
  <img id="img">

  <div class="crop-box" id="cropBox">
    <div class="handle tl"></div>
    <div class="handle tr"></div>
    <div class="handle bl"></div>
    <div class="handle br"></div>
  </div>
</div>

<button onclick="addScan()">Add Cropped Scan</button>

<div id="list"></div>

<button onclick="exportPDF()">Export PDF</button>
</div>

<script>
const { jsPDF } = window.jspdf;

let scans = [];
let img = new Image();

const editor = document.getElementById("editor");
const imgEl = document.getElementById("img");
const cropBox = document.getElementById("cropBox");

let dragging = false;
let offsetX = 0;
let offsetY = 0;

// load image
document.getElementById("file").addEventListener("change", e=>{
  const file = e.target.files[0];
  if(!file) return;

  const reader = new FileReader();
  reader.onload = ev=>{
    img.src = ev.target.result;
    imgEl.src = ev.target.result;
    editor.style.display = "block";
  };
  reader.readAsDataURL(file);
});

// move crop box
cropBox.addEventListener("pointerdown", e=>{
  dragging = true;
  offsetX = e.offsetX;
  offsetY = e.offsetY;
});

document.addEventListener("pointermove", e=>{
  if(!dragging) return;

  const rect = editor.getBoundingClientRect();

  let x = e.clientX - rect.left - offsetX;
  let y = e.clientY - rect.top - offsetY;

  x = Math.max(0, Math.min(rect.width - cropBox.offsetWidth, x));
  y = Math.max(0, Math.min(rect.height - cropBox.offsetHeight, y));

  cropBox.style.left = x + "px";
  cropBox.style.top = y + "px";
});

document.addEventListener("pointerup", ()=> dragging=false);

// crop function
function cropImage(){
  const canvas = document.createElement("canvas");
  const ctx = canvas.getContext("2d");

  const imgRect = imgEl.getBoundingClientRect();
  const boxRect = cropBox.getBoundingClientRect();

  const scaleX = img.width / imgRect.width;
  const scaleY = img.height / imgRect.height;

  const x = (boxRect.left - imgRect.left) * scaleX;
  const y = (boxRect.top - imgRect.top) * scaleY;
  const w = boxRect.width * scaleX;
  const h = boxRect.height * scaleY;

  canvas.width = w;
  canvas.height = h;

  ctx.drawImage(img, x, y, w, h, 0, 0, w, h);

  return canvas.toDataURL("image/jpeg", 0.95);
}

// add scan
function addScan(){
  const cropped = cropImage();
  scans.push(cropped);
  render();

  editor.style.display = "none";
  document.getElementById("file").value = "";
}

// render list
function render(){
  const list = document.getElementById("list");
  list.innerHTML = "";

  scans.forEach((s,i)=>{
    const div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <div>Page ${i+1}</div>
      <img src="${s}">
      <button class="delete" onclick="del(${i})">Delete</button>
    `;

    list.appendChild(div);
  });
}

function del(i){
  scans.splice(i,1);
  render();
}

// export PDF
function exportPDF(){
  if(scans.length === 0){
    alert("No scans");
    return;
  }

  const doc = new jsPDF();

  scans.forEach((s,i)=>{
    if(i !== 0) doc.addPage();
    doc.addImage(s, "JPEG", 10, 10, 190, 260);
  });

  doc.save("scan.pdf");
}
</script>

</body>
</html>
