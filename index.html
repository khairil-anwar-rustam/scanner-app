<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scanner Ultra Pro AI</title>

<style>
body{
margin:0;
font-family:Arial;
background:#0b1220;
color:white;
text-align:center;
}

header{
padding:12px;
background:#111a2e;
font-weight:bold;
}

#controls{
display:flex;
flex-wrap:wrap;
gap:8px;
justify-content:center;
padding:10px;
background:#0f172a;
}

button,input{
padding:10px;
border:0;
border-radius:8px;
font-weight:bold;
}

button{background:#22c55e;cursor:pointer;}

#editor{
position:relative;
height:60vh;
margin:10px;
background:black;
overflow:hidden;
border-radius:10px;
}

#img{
width:100%;
height:100%;
object-fit:contain;
}

.corner{
position:absolute;
width:18px;
height:18px;
background:red;
border-radius:50%;
cursor:grab;
z-index:10;
}

#pages{
display:flex;
overflow-x:auto;
padding:10px;
}

.page{
width:80px;
height:100px;
object-fit:cover;
border:2px solid #22c55e;
margin:5px;
}

canvas{display:none;}
</style>

</head>

<body>

<header>📄 Scanner ULTRA PRO AI (Auto Border Detection)</header>

<div id="controls">
<input type="file" id="fileInput" accept="image/*">

<button onclick="autoDetectBorder()">AI Auto Detect</button>
<button onclick="applyWarp()">Perspective Fix</button>
<button onclick="addPage()">Add Page</button>
<button onclick="exportPDF()">Export PDF</button>
<button onclick="runOCR()">OCR</button>
</div>

<div id="editor">
<img id="img">
<div class="corner" id="c1"></div>
<div class="corner" id="c2"></div>
<div class="corner" id="c3"></div>
<div class="corner" id="c4"></div>
</div>

<div id="pages"></div>
<canvas id="canvas"></canvas>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://docs.opencv.org/4.x/opencv.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<script>

let img = document.getElementById("img");
let fileInput = document.getElementById("fileInput");
let canvas = document.getElementById("canvas");
let ctx = canvas.getContext("2d");

let editor = document.getElementById("editor");

let pages = [];
let dragging = null;

let corners = [
c1,c2,c3,c4
];

/* ================= LOAD IMAGE ================= */
fileInput.onchange = e=>{
let file = e.target.files[0];
let reader = new FileReader();

reader.onload = ev=>{
img.src = ev.target.result;
img.onload = ()=> initCorners();
};

reader.readAsDataURL(file);
};

/* ================= INIT CORNERS ================= */
function initCorners(){
corners.forEach((c,i)=>{
c.style.left = (20 + i*40) + "px";
c.style.top = (20 + i*40) + "px";
});

corners.forEach(c=>{
c.onmousedown = ()=> dragging = c;
});

document.onmousemove = e=>{
if(!dragging) return;

let rect = editor.getBoundingClientRect();

dragging.style.left = (e.clientX - rect.left) + "px";
dragging.style.top = (e.clientY - rect.top) + "px";
};

document.onmouseup = ()=> dragging = null;
}

/* ================= AI BORDER DETECTION ================= */
function autoDetectBorder(){
if(!window.cv){
alert("OpenCV loading...");
return;
}

let src = cv.imread(img);
let gray = new cv.Mat();
let blur = new cv.Mat();
let edges = new cv.Mat();
let hierarchy = new cv.Mat();
let contours = new cv.MatVector();

cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
cv.GaussianBlur(gray, blur, new cv.Size(5,5), 0);
cv.Canny(blur, edges, 50, 150);

cv.findContours(edges, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

let maxArea = 0;
let best = null;

/* find largest quadrilateral */
for(let i=0;i<contours.size();i++){
let cnt = contours.get(i);
let approx = new cv.Mat();

cv.approxPolyDP(cnt, approx, 0.02 * cv.arcLength(cnt, true), true);

if(approx.rows === 4){
let area = cv.contourArea(cnt);
if(area > maxArea){
maxArea = area;
best = approx;
}
}
}

/* fallback */
if(!best){
alert("No document detected - try better lighting");
src.delete(); gray.delete(); blur.delete(); edges.delete(); contours.delete(); hierarchy.delete();
return;
}

/* convert detected points -> corners */
let pts = [];
for(let i=0;i<4;i++){
pts.push(best.data32S[i*2]);
pts.push(best.data32S[i*2+1]);
}

/* normalize to image display */
let rect = editor.getBoundingClientRect();

for(let i=0;i<4;i++){
corners[i].style.left = (pts[i*2] / img.width * rect.width) + "px";
corners[i].style.top  = (pts[i*2+1] / img.height * rect.height) + "px";
}

alert("AI border detected ✔");

src.delete(); gray.delete(); blur.delete(); edges.delete(); contours.delete(); hierarchy.delete();
}

/* ================= PERSPECTIVE WARP ================= */
function applyWarp(){
if(!window.cv) return;

let rect = editor.getBoundingClientRect();

function getCorner(id){
let el = document.getElementById(id);
return [
(el.offsetLeft / rect.width) * img.width,
(el.offsetTop / rect.height) * img.height
];
}

let srcPts = cv.matFromArray(4,1,cv.CV_32FC2,[
...getCorner("c1"),
...getCorner("c2"),
...getCorner("c3"),
...getCorner("c4")
]);

let dstPts = cv.matFromArray(4,1,cv.CV_32FC2,[
0,0,
img.width,0,
img.width,img.height,
0,img.height
]);

let src = cv.imread(img);
let M = cv.getPerspectiveTransform(srcPts, dstPts);

let dst = new cv.Mat();
cv.warpPerspective(src, dst, M, new cv.Size(img.width,img.height));

cv.imshow(canvas, dst);
img.src = canvas.toDataURL();

src.delete(); dst.delete(); M.delete();
srcPts.delete(); dstPts.delete();

alert("Warp applied ✔");
}

/* ================= MULTI PAGE ================= */
function addPage(){
pages.push(img.src);
renderPages();
}

function renderPages(){
let box = document.getElementById("pages");
box.innerHTML = "";

pages.forEach(p=>{
let im = document.createElement("img");
im.src = p;
im.className = "page";
box.appendChild(im);
});
}

/* ================= OCR ================= */
async function runOCR(){
let result = await Tesseract.recognize(img.src,'eng');
alert(result.data.text);
}

/* ================= PDF EXPORT ================= */
async function exportPDF(){
const { jsPDF } = window.jspdf;
let pdf = new jsPDF();

let all = [img.src, ...pages];

for(let i=0;i<all.length;i++){
await new Promise(res=>{
let temp = new Image();
temp.src = all[i];

temp.onload = ()=>{
canvas.width = temp.width;
canvas.height = temp.height;
ctx.drawImage(temp,0,0);

let data = canvas.toDataURL("image/jpeg");

pdf.addImage(data,"JPEG",10,10,180,250);

if(i !== all.length-1) pdf.addPage();

res();
};
});
}

pdf.save("scan-ai-pro.pdf");
}

</script>

</body>
  </html>
