<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pro Scanner - Perspective Crop</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f172a;
  color:white;
}

.container{
  max-width:900px;
  margin:auto;
  padding:12px;
}

h1{
  text-align:center;
  font-size:18px;
}

input, button{
  width:100%;
  padding:10px;
  margin:8px 0;
  border:none;
  border-radius:8px;
}

button{
  background:#22c55e;
  font-weight:bold;
}

.editor{
  position:relative;
  margin-top:10px;
  background:#111827;
  border-radius:10px;
  overflow:hidden;
}

#img{
  width:100%;
  display:block;
}

.point{
  width:16px;
  height:16px;
  background:#00ff99;
  border-radius:50%;
  position:absolute;
  transform:translate(-50%,-50%);
  cursor:pointer;
  border:2px solid #000;
}

.list .card{
  background:#1e293b;
  padding:10px;
  margin-top:10px;
  border-radius:10px;
}

.card img{
  width:100%;
  border-radius:8px;
  margin-top:8px;
}

.delete{
  background:#ef4444;
  margin-top:6px;
}
</style>
</head>

<body>

<div class="container">
<h1>Scanner Pro (4-Corner Perspective)</h1>

<input type="file" id="file" accept="image/*">

<div class="editor" id="editor" style="display:none;">
  <img id="img">

  <div class="point" id="p1"></div>
  <div class="point" id="p2"></div>
  <div class="point" id="p3"></div>
  <div class="point" id="p4"></div>
</div>

<button onclick="addScan()">Add Scan</button>

<div id="list"></div>

<button onclick="exportPDF()">Export PDF</button>
</div>

<script>
const { jsPDF } = window.jspdf;

let img = new Image();
let scans = [];

const editor = document.getElementById('editor');
const imageEl = document.getElementById('img');

const points = [
  document.getElementById('p1'),
  document.getElementById('p2'),
  document.getElementById('p3'),
  document.getElementById('p4')
];

let dragging = null;

// load image
document.getElementById('file').addEventListener('change', e=>{
  const file = e.target.files[0];
  if(!file) return;

  const reader = new FileReader();
  reader.onload = ev=>{
    img.src = ev.target.result;
    imageEl.src = ev.target.result;
    editor.style.display = 'block';
  };
  reader.readAsDataURL(file);
});

// init points after image load
img.onload = ()=>{
  const rect = editor.getBoundingClientRect();

  points[0].style.left = "50px";
  points[0].style.top = "50px";

  points[1].style.left = (rect.width-50) + "px";
  points[1].style.top = "50px";

  points[2].style.left = (rect.width-50) + "px";
  points[2].style.top = (rect.height-50) + "px";

  points[3].style.left = "50px";
  points[3].style.top = (rect.height-50) + "px";
};

// drag points
points.forEach(p=>{
  p.addEventListener('mousedown', ()=> dragging = p);
});

document.addEventListener('mousemove', e=>{
  if(!dragging) return;

  const rect = editor.getBoundingClientRect();

  dragging.style.left = (e.clientX - rect.left) + "px";
  dragging.style.top = (e.clientY - rect.top) + "px";
});

document.addEventListener('mouseup', ()=> dragging=null);

// perspective transform (simple approximation using canvas sampling)
function warpImage(src, pts, width, height){
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');

  canvas.width = width;
  canvas.height = height;

  const temp = new Image();
  temp.src = src;

  return new Promise(resolve=>{
    temp.onload = ()=>{

      // brute-force grid warp (simple CamScanner-like approximation)
      const divisions = 200;

      const [p1,p2,p3,p4] = pts;

      for(let i=0;i<divisions;i++){
        for(let j=0;j<divisions;j++){

          const u = i/divisions;
          const v = j/divisions;

          // bilinear interpolation (fake perspective warp)
          const xTop = p1.x + (p2.x - p1.x)*u;
          const yTop = p1.y + (p2.y - p1.y)*u;

          const xBottom = p4.x + (p3.x - p4.x)*u;
          const yBottom = p4.y + (p3.y - p4.y)*u;

          const x = xTop + (xBottom - xTop)*v;
          const y = yTop + (yBottom - yTop)*v;

          const sx = (x / editor.clientWidth) * temp.width;
          const sy = (y / editor.clientHeight) * temp.height;

          const dx = u * width;
          const dy = v * height;

          ctx.drawImage(temp, sx, sy, 2, 2, dx, dy, 2, 2);
        }
      }

      resolve(canvas.toDataURL("image/jpeg",0.95));
    };
  });
}

// get points
function getPoints(){
  return points.map(p=>{
    const rect = editor.getBoundingClientRect();
    return {
      x: parseFloat(p.style.left) / rect.width * editor.clientWidth,
      y: parseFloat(p.style.top) / rect.height * editor.clientHeight
    };
  });
}

// add scan
async function addScan(){
  const warped = await warpImage(img.src, getPoints(), 1000, 1400);

  scans.push(warped);
  render();

  editor.style.display = 'none';
  document.getElementById('file').value = '';
}

// render
function render(){
  const list = document.getElementById('list');
  list.innerHTML = '';

  scans.forEach((s,i)=>{
    const div = document.createElement('div');
    div.className = 'card';

    div.innerHTML = `
      <div>Page ${i+1}</div>
      <img src="${s}">
      <button class="delete" onclick="deleteScan(${i})">Delete</button>
    `;

    list.appendChild(div);
  });
}

// delete
function deleteScan(i){
  scans.splice(i,1);
  render();
}

// export PDF
function exportPDF(){
  const doc = new jsPDF();

  scans.forEach((s,i)=>{
    if(i!==0) doc.addPage();
    doc.addImage(s,'JPEG',10,10,190,260);
  });

  doc.save("scan.pdf");
}
</script>

</body>
  </html>
