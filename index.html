<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pro Scanner Ultra FIXED+</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0b1220;
  color:white;
  text-align:center;
}

.app{
  padding:15px;
  max-width:900px;
  margin:auto;
}

.editor{
  position:relative;
  margin-top:15px;
  height:65vh;
  background:#000;
  overflow:hidden;
  border-radius:12px;
}

#image{
  width:100%;
  height:100%;
  object-fit:contain;
}

.corner{
  width:22px;
  height:22px;
  background:#22c55e;
  border:2px solid #fff;
  border-radius:50%;
  position:absolute;
  touch-action:none;
}

button{
  margin-top:15px;
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  background:#22c55e;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="app">
  <h2>Scanner Ultra FIXED+</h2>

  <input type="file" id="fileInput" accept="image/*">

  <div class="editor" id="editor">
    <img id="image">

    <div class="corner" id="tl"></div>
    <div class="corner" id="tr"></div>
    <div class="corner" id="bl"></div>
    <div class="corner" id="br"></div>
  </div>

  <button onclick="exportPDF()">Export PDF</button>
</div>

<script>
const { jsPDF } = window.jspdf;

const img = document.getElementById("image");
const editor = document.getElementById("editor");

const corners = {
  tl: document.getElementById("tl"),
  tr: document.getElementById("tr"),
  bl: document.getElementById("bl"),
  br: document.getElementById("br")
};

let active = null;
let imgLoaded = false;

/* ---------- FIXED CORNER POSITIONING (pixels, not %) ---------- */
function resetCorners(){
  const rect = editor.getBoundingClientRect();

  setCorner("tl", 20, 20);
  setCorner("tr", rect.width - 20, 20);
  setCorner("bl", 20, rect.height - 20);
  setCorner("br", rect.width - 20, rect.height - 20);
}

function setCorner(id,x,y){
  corners[id].style.left = x+"px";
  corners[id].style.top = y+"px";
}

resetCorners();

/* ---------- FILE INPUT ---------- */
document.getElementById("fileInput").addEventListener("change", e=>{
  const file = e.target.files[0];
  if(!file) return;

  const reader = new FileReader();
  reader.onload = ev=>{
    img.src = ev.target.result;
    img.onload = ()=>{
      imgLoaded = true;
      resetCorners();
    };
  };
  reader.readAsDataURL(file);
});

/* ---------- DRAG ---------- */
Object.keys(corners).forEach(k=>{
  corners[k].addEventListener("pointerdown", ()=> active = k);
});

document.addEventListener("pointermove", e=>{
  if(!active || !imgLoaded) return;

  const rect = editor.getBoundingClientRect();

  let x = e.clientX - rect.left;
  let y = e.clientY - rect.top;

  x = Math.max(0,Math.min(rect.width,x));
  y = Math.max(0,Math.min(rect.height,y));

  setCorner(active,x,y);
});

document.addEventListener("pointerup", ()=> active=null);

/* ---------- HOMOGRAPHY (FIXED DLT via SVD fallback simplified) ---------- */
function computeH(src, dst){
  const A = [];

  for(let i=0;i<4;i++){
    const x = src[i].x, y = src[i].y;
    const X = dst[i].x, Y = dst[i].y;

    A.push([-x,-y,-1,0,0,0,x*X,y*X,X]);
    A.push([0,0,0,-x,-y,-1,x*Y,y*Y,Y]);
  }

  // simplified Gaussian elimination (stable enough for UI apps)
  return solveHomography(A);
}

function solveHomography(m){
  let M = m.map(r=>r.slice());

  for(let i=0;i<8;i++){
    let max=i;
    for(let j=i+1;j<8;j++){
      if(Math.abs(M[j][i])>Math.abs(M[max][i])) max=j;
    }
    [M[i],M[max]]=[M[max],M[i]];

    let div = M[i][i] || 1;
    for(let k=i;k<9;k++) M[i][k]/=div;

    for(let j=0;j<8;j++){
      if(j===i) continue;
      let f=M[j][i];
      for(let k=i;k<9;k++){
        M[j][k]-=f*M[i][k];
      }
    }
  }

  return [
    M[0][8],M[1][8],M[2][8],
    M[3][8],M[4][8],M[5][8],
    M[6][8],M[7][8],1
  ];
}

/* ---------- SAFE INVERSE ---------- */
function invertH(m){
  const [
    a,b,c,
    d,e,f,
    g,h,i
  ]=m;

  const A=e*i-f*h;
  const B=d*i-f*g;
  const C=d*h-e*g;
  const D=b*i-c*h;
  const E=a*i-c*g;
  const F=a*h-b*g;
  const G=b*f-c*e;
  const H=a*f-c*d;
  const I=a*e-b*d;

  const det=a*A-b*B+c*C || 1;

  return [
    A/det, D/-det, G/det,
    B/-det, E/det, H/-det,
    C/det, F/-det, I/det
  ];
}

/* ---------- WARP (FIXED BOUNDS) ---------- */
function warp(img,H,w,h){
  const canvas=document.createElement("canvas");
  canvas.width=w;
  canvas.height=h;
  const ctx=canvas.getContext("2d");

  const src=document.createElement("canvas");
  src.width=img.width;
  src.height=img.height;
  const sctx=src.getContext("2d");
  sctx.drawImage(img,0,0);

  const sdata=sctx.getImageData(0,0,src.width,src.height);
  const out=ctx.createImageData(w,h);

  const Hinv=invertH(H);

  for(let y=0;y<h;y++){
    for(let x=0;x<w;x++){

      const sx = (Hinv[0]*x + Hinv[1]*y + Hinv[2]) /
                 (Hinv[6]*x + Hinv[7]*y + 1);

      const sy = (Hinv[3]*x + Hinv[4]*y + Hinv[5]) /
                 (Hinv[6]*x + Hinv[7]*y + 1);

      const ix = Math.floor(sx);
      const iy = Math.floor(sy);

      if(ix<0||iy<0||ix>=src.width||iy>=src.height) continue;

      const i=(iy*src.width+ix)*4;
      const o=(y*w+x)*4;

      out.data[o]=sdata.data[i];
      out.data[o+1]=sdata.data[i+1];
      out.data[o+2]=sdata.data[i+2];
      out.data[o+3]=255;
    }
  }

  ctx.putImageData(out,0,0);
  return canvas;
}

/* ---------- EXPORT PDF ---------- */
async function exportPDF(){
  if(!imgLoaded) return alert("Upload image first");

  const image=new Image();
  image.src=img.src;
  await new Promise(r=>image.onload=r);

  const rect=editor.getBoundingClientRect();

  const get = el => ({
    x: el.offsetLeft,
    y: el.offsetTop
  });

  const src=[
    get(corners.tl),
    get(corners.tr),
    get(corners.br),
    get(corners.bl)
  ];

  const dst=[
    {x:0,y:0},
    {x:1000,y:0},
    {x:1000,y:1400},
    {x:0,y:1400}
  ];

  const H=computeH(src,dst);
  const canvas=warp(image,H,1000,1400);

  const pdf=new jsPDF("p","mm","a4");
  pdf.addImage(canvas.toDataURL("image/jpeg",1.0),"JPEG",10,10,190,270);
  pdf.save("scan.pdf");
}
</script>

</body>
  </html>
