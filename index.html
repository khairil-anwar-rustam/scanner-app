<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AI Document Scanner</title>

<script async src="https://docs.opencv.org/4.x/opencv.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body{
margin:0;
background:#0b1220;
color:white;
font-family:Arial;
text-align:center;
}

header{
padding:12px;
background:#111a2e;
font-weight:bold;
}

canvas{
max-width:100%;
border-radius:10px;
margin-top:10px;
}

button{
margin:6px;
padding:10px 14px;
border-radius:8px;
border:none;
background:#1f2a44;
color:white;
font-weight:bold;
}

input{
margin:10px;
}
</style>
</head>

<body>

<header>📄 AI Scanner (OpenCV Powered)</header>

<input type="file" id="file" accept="image/*"/>

<br>

<canvas id="canvas"></canvas>

<br>

<button onclick="autoScan()">Auto Scan</button>
<button onclick="exportPDF()">Export PDF</button>

<script>
let img = new Image();
let srcMat, dstMat;

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

// ---------- LOAD IMAGE ----------
document.getElementById("file").onchange = e=>{
const reader = new FileReader();
reader.onload = ev=>{
img = new Image();
img.onload = ()=>{
canvas.width = img.width;
canvas.height = img.height;
ctx.drawImage(img,0,0);
};
img.src = ev.target.result;
};
reader.readAsDataURL(e.target.files[0]);
};

// ---------- WAIT FOR OPENCV ----------
function onOpenCvReady(){
console.log("OpenCV Ready");
}

// ---------- AUTO SCAN ----------
function autoScan(){

srcMat = cv.imread(canvas);
let gray = new cv.Mat();
let blurred = new cv.Mat();
let edges = new cv.Mat();

cv.cvtColor(srcMat, gray, cv.COLOR_RGBA2GRAY);
cv.GaussianBlur(gray, blurred, new cv.Size(5,5), 0);
cv.Canny(blurred, edges, 75, 200);

// find contours
let contours = new cv.MatVector();
let hierarchy = new cv.Mat();

cv.findContours(edges, contours, hierarchy, cv.RETR_LIST, cv.CHAIN_APPROX_SIMPLE);

let maxArea = 0;
let page = null;

for(let i=0;i<contours.size();i++){
let cnt = contours.get(i);
let area = cv.contourArea(cnt);

if(area > maxArea){
let peri = cv.arcLength(cnt,true);
let approx = new cv.Mat();

cv.approxPolyDP(cnt, approx, 0.02*peri,true);

if(approx.rows === 4){
page = approx;
maxArea = area;
}
}
}

// fallback if no document found
if(!page){
alert("Document not detected clearly. Try better lighting.");
return;
}

// perspective transform
let pts = [];
for(let i=0;i<4;i++){
pts.push({
x: page.data32S[i*2],
y: page.data32S[i*2+1]
});
}

// sort points
pts = pts.sort((a,b)=>a.y-b.y);
let top = pts.slice(0,2).sort((a,b)=>a.x-b.x);
let bottom = pts.slice(2,4).sort((a,b)=>a.x-b.x);

let tl = top[0], tr = top[1], bl = bottom[0], br = bottom[1];

let width = 800;
let height = 1000;

let srcTri = cv.matFromArray(4,1,cv.CV_32FC2,[
tl.x,tl.y,
tr.x,tr.y,
br.x,br.y,
bl.x,bl.y
]);

let dstTri = cv.matFromArray(4,1,cv.CV_32FC2,[
0,0,
width,0,
width,height,
0,height
]);

let M = cv.getPerspectiveTransform(srcTri,dstTri);

let dst = new cv.Mat();

cv.warpPerspective(srcMat,dst,M,new cv.Size(width,height));

cv.imshow(canvas,dst);

// cleanup
srcMat.delete();
gray.delete();
blurred.delete();
edges.delete();
contours.delete();
hierarchy.delete();
dst.delete();

alert("Auto scan completed!");
}

// ---------- EXPORT PDF ----------
function exportPDF(){
const { jsPDF } = window.jspdf;
let pdf = new jsPDF();

pdf.addImage(canvas.toDataURL("image/jpeg"),"JPEG",10,10,180,250);
pdf.save("scan.pdf");
}
</script>

</body>
</html>
