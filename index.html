<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scanner Pro</title>

<style>
body{margin:0;font-family:Arial;background:#0b1220;color:white}
#editor{position:relative;height:60vh;background:black}
#img{width:100%;height:100%;object-fit:contain}
.corner{position:absolute;width:20px;height:20px;background:#22c55e;border-radius:50%;transform:translate(-50%,-50%);touch-action:none}
.controls{position:fixed;bottom:0;left:0;right:0;background:#0f172a;padding:10px;display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
button{padding:10px;border:none;border-radius:8px;background:#2563eb;color:white}
button.secondary{background:#374151}
#pages{display:flex;overflow-x:auto;gap:8px;padding:10px;margin-bottom:110px}
.thumb{width:60px;height:80px;object-fit:cover;border:2px solid #334155}
.thumb.active{border-color:#22c55e}
.mode{opacity:.7}
.mode.active{opacity:1;outline:2px solid #22c55e}
#overlay{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;}
</style>
</head>
<body>

<div id="editor">
<img id="img">
<canvas id="overlay"></canvas>
<div class="corner" id="c1"></div>
<div class="corner" id="c2"></div>
<div class="corner" id="c3"></div>
<div class="corner" id="c4"></div>
</div>

<input type="file" id="file" multiple hidden>

<div class="controls">
<button onclick="file.click()">Upload</button>
<button onclick="rotatePage()">Rotate</button>
<button onclick="applyCrop()">Crop</button>
<button onclick="exportPDF()">PDF</button>

<button class="secondary mode active" id="mColor" onclick="setMode('color')">Color</button>
<button class="secondary mode" id="mGray" onclick="setMode('gray')">Gray</button>
<button class="secondary mode" id="mBW" onclick="setMode('bw')">B/W</button>
</div>

<div id="pages"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>
let pages=[];
let current=0;
let img=document.getElementById('img');
let editor=document.getElementById('editor');
let file=document.getElementById('file');
let mode='color'; // color | gray | bw

let corners=[
{x:40,y:60,id:'c1'},
{x:300,y:60,id:'c2'},
{x:300,y:400,id:'c3'},
{x:40,y:400,id:'c4'}
];

// LOAD FILES
file.onchange = (e)=>{
[...e.target.files].forEach(f=>{
let r=new FileReader();
r.onload=()=>{
pages.push(r.result);
current=pages.length-1;
show();render();
};
r.readAsDataURL(f);
});
}

function show(){img.src=pages[current];updateCorners()}

function render(){
let p=document.getElementById('pages');p.innerHTML='';
pages.forEach((src,i)=>{
let im=document.createElement('img');
im.src=src;
im.className='thumb'+(i===current?' active':'');
im.onclick=()=>{current=i;show()};
p.appendChild(im);
});
}

// MODE
function setMode(m){
mode=m;
['mColor','mGray','mBW'].forEach(id=>document.getElementById(id).classList.remove('active'));
if(m==='color') document.getElementById('mColor').classList.add('active');
if(m==='gray') document.getElementById('mGray').classList.add('active');
if(m==='bw') document.getElementById('mBW').classList.add('active');
}

// DRAG CORNERS
corners.forEach(c=>{
let el=document.getElementById(c.id);
let drag=false;

el.onmousedown=el.ontouchstart=()=>drag=true;
window.addEventListener('mouseup',()=>drag=false);
window.addEventListener('touchend',()=>drag=false);
window.addEventListener('mousemove',move);
window.addEventListener('touchmove',move);

function move(e){
if(!drag)return;
let r=editor.getBoundingClientRect();
c.x=(e.touches?e.touches[0].clientX:e.clientX)-r.left;
c.y=(e.touches?e.touches[0].clientY:e.clientY)-r.top;
updateCorners();
}
});

function updateCorners(){
corners.forEach(c=>{
let el=document.getElementById(c.id);
el.style.left=c.x+'px';
el.style.top=c.y+'px';
});
drawOverlay();
}

function drawOverlay(){
let canvas=document.getElementById('overlay');
let ctx=canvas.getContext('2d');

let rect=editor.getBoundingClientRect();
canvas.width=rect.width;
canvas.height=rect.height;

ctx.clearRect(0,0,canvas.width,canvas.height);

// dark overlay
ctx.fillStyle="rgba(0,0,0,0.55)";
ctx.fillRect(0,0,canvas.width,canvas.height);

// crop area (transparent hole)
ctx.globalCompositeOperation="destination-out";

ctx.beginPath();
ctx.moveTo(corners[0].x,corners[0].y);
ctx.lineTo(corners[1].x,corners[1].y);
ctx.lineTo(corners[2].x,corners[2].y);
ctx.lineTo(corners[3].x,corners[3].y);
ctx.closePath();
ctx.fill();

ctx.globalCompositeOperation="source-over";
  }

// ROTATE
function rotatePage(){
let image=new Image();
image.src=pages[current];
image.onload=()=>{
let c=document.createElement('canvas');
let ctx=c.getContext('2d');
c.width=image.height;
c.height=image.width;
ctx.translate(c.width/2,c.height/2);
ctx.rotate(Math.PI/2);
ctx.drawImage(image,-image.width/2,-image.height/2);
pages[current]=c.toDataURL();
show();render();
};
}

// ENHANCEMENT MODES
function applyMode(canvas){
if(mode==='color') return; // keep original

let ctx=canvas.getContext('2d');
let imgData=ctx.getImageData(0,0,canvas.width,canvas.height);
let d=imgData.data;

for(let i=0;i<d.length;i+=4){
let r=d[i], g=d[i+1], b=d[i+2];
let gray=0.3*r+0.59*g+0.11*b;

if(mode==='gray'){
// clean grayscale with mild contrast
let v=(gray-128)*1.2+128;
d[i]=d[i+1]=d[i+2]=v;
}

if(mode==='bw'){
// high-contrast document (threshold)
let v=(gray-128)*1.6+128;
v = v>150 ? 255 : 0;
d[i]=d[i+1]=d[i+2]=v;
}
}
ctx.putImageData(imgData,0,0);
}

// FAST WARP
function applyCrop(){
let image=new Image();
image.src=pages[current];

image.onload=()=>{
let canvas=document.createElement('canvas');
let ctx=canvas.getContext('2d');

let w=1200,h=1600;
canvas.width=w;
canvas.height=h;

// scale image to editor coordinates
let rect=editor.getBoundingClientRect();
let scaleX=image.width/rect.width;
let scaleY=image.height/rect.height;

// source quad (user selected)
let src=[
{ x: corners[0].x * scaleX, y: corners[0].y * scaleY },
{ x: corners[1].x * scaleX, y: corners[1].y * scaleY },
{ x: corners[2].x * scaleX, y: corners[2].y * scaleY },
{ x: corners[3].x * scaleX, y: corners[3].y * scaleY }
];

// destination quad (perfect rectangle)
let dst=[
{ x: 0, y: 0 },
{ x: w, y: 0 },
{ x: w, y: h },
{ x: 0, y: h }
];

// helper: draw warped quad using 2 triangles
function warp(s0,s1,s2,d0,d1,d2){

ctx.save();

ctx.beginPath();
ctx.moveTo(d0.x,d0.y);
ctx.lineTo(d1.x,d1.y);
ctx.lineTo(d2.x,d2.y);
ctx.closePath();
ctx.clip();

// solve transform matrix
let denom =
s0.x*(s1.y-s2.y)+
s1.x*(s2.y-s0.y)+
s2.x*(s0.y-s1.y);

let a =
(d0.x*(s1.y-s2.y)+
 d1.x*(s2.y-s0.y)+
 d2.x*(s0.y-s1.y))/denom;

let b =
(d0.x*(s2.x-s1.x)+
 d1.x*(s0.x-s2.x)+
 d2.x*(s1.x-s0.x))/denom;

let c =
(d0.y*(s1.y-s2.y)+
 d1.y*(s2.y-s0.y)+
 d2.y*(s0.y-s1.y))/denom;

let d =
(d0.y*(s2.x-s1.x)+
 d1.y*(s0.x-s2.x)+
 d2.y*(s1.x-s0.x))/denom;

let e =
(d0.x*(s1.x*s2.y-s2.x*s1.y)+
 d1.x*(s2.x*s0.y-s0.x*s2.y)+
 d2.x*(s0.x*s1.y-s1.x*s0.y))/denom;

let f =
(d0.y*(s1.x*s2.y-s2.x*s1.y)+
 d1.y*(s2.x*s0.y-s0.x*s2.y)+
 d2.y*(s0.x*s1.y-s1.x*s0.y))/denom;

ctx.setTransform(a,c,b,d,e,f);
ctx.drawImage(image,0,0);

ctx.restore();
}

// split quad into 2 triangles
warp(src[0],src[1],src[2],dst[0],dst[1],dst[2]);
warp(src[0],src[2],src[3],dst[0],dst[2],dst[3]);

applyMode(canvas);

pages[current]=canvas.toDataURL('image/jpeg',1);
show();
render();
};
}

// TOUCH REORDER (MOBILE FRIENDLY)
let touchIndex = null;
let pagesContainer = document.getElementById('pages');

pagesContainer.addEventListener('touchstart', (e) => {
  let target = e.target.closest('img');
  if(!target) return;
  touchIndex = [...pagesContainer.children].indexOf(target);
  target.style.opacity = 0.5;
});

pagesContainer.addEventListener('touchmove', (e) => {
  e.preventDefault();
  let touch = e.touches[0];
  let target = document.elementFromPoint(touch.clientX, touch.clientY);
  let over = target?.closest('img');

  if(!over || touchIndex === null) return;

  let overIndex = [...pagesContainer.children].indexOf(over);

  if(overIndex !== touchIndex){
    let moved = pages.splice(touchIndex,1)[0];
    pages.splice(overIndex,0,moved);
    touchIndex = overIndex;
    render();
  }
});

pagesContainer.addEventListener('touchend', () => {
  touchIndex = null;
  render();
});

// DESKTOP DRAG (fallback)
pagesContainer.addEventListener('dragstart',e=>{
  dragIndex = [...e.target.parentNode.children].indexOf(e.target);
});

pagesContainer.addEventListener('dragover',e=>{e.preventDefault();});

pagesContainer.addEventListener('drop',e=>{
  e.preventDefault();
  let target = e.target.closest('img');
  if(!target) return;
  let dropIndex = [...target.parentNode.children].indexOf(target);

  let moved = pages.splice(dragIndex,1)[0];
  pages.splice(dropIndex,0,moved);

  current = dropIndex;
  render();
  show();
});

// UPDATE render to allow drag
function render(){
let p=document.getElementById('pages');p.innerHTML='';
pages.forEach((src,i)=>{
let im=document.createElement('img');
im.src=src;
im.draggable=true;
im.className='thumb'+(i===current?' active':'');
im.onclick=()=>{current=i;show()};
p.appendChild(im);
});
}

// PDF
function exportPDF(){
const {jsPDF}=window.jspdf;
let pdf=new jsPDF('p','pt','a4');
pages.forEach((img,i)=>{
pdf.addImage(img,'JPEG',0,0,595,842);
if(i<pages.length-1)pdf.addPage();
});
pdf.save('scan.pdf');
}

</script>
</body>
  </html>
