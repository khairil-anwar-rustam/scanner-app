<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simple Scanner App</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#0f172a;
  color:#fff;
}

.container{
  padding:16px;
  max-width:900px;
  margin:auto;
}

h1{
  font-size:20px;
  margin-bottom:10px;
  text-align:center;
}

input[type="file"]{
  width:100%;
  padding:10px;
  margin:10px 0;
  background:#1e293b;
  color:#fff;
  border-radius:8px;
}

button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  background:#22c55e;
  color:#000;
  font-weight:bold;
  margin-top:10px;
}

.list{
  margin-top:15px;
}

.card{
  background:#1e293b;
  padding:10px;
  border-radius:10px;
  margin-bottom:12px;
}

.card img{
  width:100%;
  border-radius:8px;
  margin-top:8px;
}

.delete-btn{
  background:#ef4444;
  color:#fff;
  border:none;
  border-radius:6px;
  padding:5px 10px;
  font-size:12px;
  margin-top:8px;
}
</style>
</head>

<body>
<div class="container">
  <h1>Document Scanner</h1>

  <input type="file" id="file" accept="image/*">

  <div class="list" id="list"></div>

  <button onclick="generatePDF()">Export PDF</button>
</div>

<script>
const { jsPDF } = window.jspdf;
let scans = [];

// compress image
function compressImage(file){
  return new Promise(resolve => {
    const img = new Image();
    const reader = new FileReader();

    reader.onload = e => img.src = e.target.result;
    img.onload = () => {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');

      const maxWidth = 1000;
      const scale = maxWidth / img.width;

      canvas.width = maxWidth;
      canvas.height = img.height * scale;

      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

      resolve(canvas.toDataURL('image/jpeg', 0.85));
    };

    reader.readAsDataURL(file);
  });
}

// add scan
document.getElementById('file').addEventListener('change', async function(){
  const file = this.files[0];
  if(!file) return;

  const imgData = await compressImage(file);

  scans.push({ imgData });

  this.value = '';
  render();
});

// delete scan
function deleteScan(index){
  scans.splice(index,1);
  render();
}

// render list
function render(){
  const list = document.getElementById('list');
  list.innerHTML = '';

  scans.forEach((s, i) => {
    const div = document.createElement('div');
    div.className = 'card';

    div.innerHTML = `
      <div>Page ${i + 1}</div>
      <img src="${s.imgData}">
      <button class="delete-btn" onclick="deleteScan(${i})">Delete</button>
    `;

    list.appendChild(div);
  });
}

// export PDF
async function generatePDF(){
  if(scans.length === 0){
    alert("No scans to export");
    return;
  }

  const doc = new jsPDF('p','mm','a4');

  for(let i = 0; i < scans.length; i++){
    const img = new Image();
    img.src = scans[i].imgData;

    await new Promise(res => img.onload = res);

    if(i !== 0) doc.addPage();

    const pageWidth = 190;
    let imgWidth = pageWidth;
    let imgHeight = (img.height / img.width) * imgWidth;

    const maxHeight = 270;

    if(imgHeight > maxHeight){
      imgHeight = maxHeight;
      imgWidth = (img.width / img.height) * imgHeight;
    }

    doc.addImage(scans[i].imgData, 'JPEG', 10, 10, imgWidth, imgHeight);
  }

  doc.save('scanned-documents.pdf');
}
</script>

</body>
</html>
