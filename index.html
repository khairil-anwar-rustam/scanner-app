<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scanner Pro Fixed</title>

<style>
body{margin:0;font-family:Arial;background:#0b1220;color:white}

#editor{
position:relative;
height:60vh;
background:black;
display:flex;
align-items:center;
justify-content:center;
}

#img{
max-width:100%;
max-height:100%;
object-fit:contain;
}

.corner{
position:absolute;
width:20px;
height:20px;
background:#22c55e;
border-radius:50%;
transform:translate(-50%,-50%);
touch-action:none;
}

#overlay{
position:absolute;
top:0;left:0;
width:100%;height:100%;
pointer-events:none;
}

.controls{
position:fixed;
bottom:0;left:0;right:0;
background:#0f172a;
padding:10px;
display:flex;
gap:6px;
justify-content:center;
flex-wrap:wrap;
}

button{
padding:10px;
border:none;
border-radius:8px;
background:#2563eb;
color:white;
}

</style>
</head>

<body>

<div id="editor">
<img id="img">
<canvas id="overlay"></canvas>

<div class="corner" id="c1"></div>
<div class="corner" id="c2"></div>
<div class="corner" id="c3"></div>
<div class="corner" id="c4"></div>
</div>

<input type="file" id="file" multiple hidden>

<div class="controls">
<button onclick="file.click()">Upload</button>
<button onclick="applyCrop()">Crop</button>
<button onclick="exportPDF()">PDF</button>
</div>

<div id="pages"></div>

<div id="previewBox" style="position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;flex-direction:column;z-index:9999;">
<img id="previewImg" style="max-width:90%;max-height:70%;">
<button onclick="confirmCrop()">Confirm</button>
<button onclick="cancelCrop()">Cancel</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>

let pages=[], current=0;
let img=document.getElementById('img');
let editor=document.getElementById('editor');
let file=document.getElementById('file');

let tempCroppedImage=null;

let corners=[
{x:40,y:60,id:'c1'},
{x:300,y:60,id:'c2'},
{x:300,y:400,id:'c3'},
{x:40,y:400,id:'c4'}
];

// LOAD
file.onchange=(e)=>{
[...e.target.files].forEach(f=>{
let r=new FileReader();
r.onload=()=>{
pages.push(r.result);
current=pages.length-1;
show();
render();
};
r.readAsDataURL(f);
});
};

// SHOW
function show(){
img.src=pages[current];
img.onload=()=>{
updateCorners();
drawOverlay();
};
}

// GET EXACT IMAGE BOX (IMPORTANT FIX)
function getImageBox(){
let r=img.getBoundingClientRect();
let iw=img.naturalWidth;
let ih=img.naturalHeight;

let scale=Math.min(r.width/iw,r.height/ih);

let w=iw*scale;
let h=ih*scale;

let x=(r.width-w)/2;
let y=(r.height-h)/2;

return {scale,x,y,w,h};
}

// CORNERS DRAG
corners.forEach(c=>{
let el=document.getElementById(c.id);
let drag=false;

el.onmousedown=el.ontouchstart=()=>drag=true;
window.addEventListener('mouseup',()=>drag=false);
window.addEventListener('touchend',()=>drag=false);

window.addEventListener('mousemove',move);
window.addEventListener('touchmove',move);

function move(e){
if(!drag)return;

let r=editor.getBoundingClientRect();
let x=(e.touches?e.touches[0].clientX:e.clientX)-r.left;
let y=(e.touches?e.touches[0].clientY:e.clientY)-r.top;

c.x=Math.max(0,Math.min(r.width,x));
c.y=Math.max(0,Math.min(r.height,y));

updateCorners();
}
});

function updateCorners(){
corners.forEach(c=>{
let el=document.getElementById(c.id);
el.style.left=c.x+'px';
el.style.top=c.y+'px';
});
drawOverlay();
}

// OVERLAY
function drawOverlay(){
let canvas=document.getElementById('overlay');
let ctx=canvas.getContext('2d');

let r=editor.getBoundingClientRect();
canvas.width=r.width;
canvas.height=r.height;

ctx.clearRect(0,0,r.width,r.height);

ctx.fillStyle="rgba(0,0,0,0.55)";
ctx.fillRect(0,0,r.width,r.height);

ctx.globalCompositeOperation="destination-out";
ctx.beginPath();
ctx.moveTo(corners[0].x,corners[0].y);
ctx.lineTo(corners[1].x,corners[1].y);
ctx.lineTo(corners[2].x,corners[2].y);
ctx.lineTo(corners[3].x,corners[3].y);
ctx.closePath();
ctx.fill();

ctx.globalCompositeOperation="source-over";
}

// 🔥 FIXED CROP (NO ZOOM OUT ANYMORE)
function applyCrop(){

let image=new Image();
image.src=pages[current];

image.onload=()=>{

let box=getImageBox();

let src=corners.map(p=>({
x:(p.x-box.x)/box.scale,
y:(p.y-box.y)/box.scale
}));

// bounding crop (critical fix)
let minX=Math.min(...src.map(p=>p.x));
let maxX=Math.max(...src.map(p=>p.x));
let minY=Math.min(...src.map(p=>p.y));
let maxY=Math.max(...src.map(p=>p.y));

let w=Math.max(1,Math.floor(maxX-minX));
let h=Math.max(1,Math.floor(maxY-minY));

src=src.map(p=>({x:p.x-minX,y:p.y-minY}));

let canvas=document.createElement('canvas');
let ctx=canvas.getContext('2d');
canvas.width=w;
canvas.height=h;

// draw source
let tmp=document.createElement('canvas');
let tctx=tmp.getContext('2d');
tmp.width=image.width;
tmp.height=image.height;
tctx.drawImage(image,0,0);

let data=tctx.getImageData(0,0,image.width,image.height);
let out=tctx.createImageData(w,h);

// simple warp
function map(x,y){
let d=1;
let ix=x/w*image.width;
let iy=y/h*image.height;
return [ix,iy];
}

for(let y=0;y<h;y++){
for(let x=0;x<w;x++){

let [sx,sy]=map(x,y);

sx=Math.floor(Math.max(0,Math.min(image.width-1,sx)));
sy=Math.floor(Math.max(0,Math.min(image.height-1,sy)));

let i=(sy*image.width+sx)*4;
let o=(y*w+x)*4;

out.data[o]=data.data[i];
out.data[o+1]=data.data[i+1];
out.data[o+2]=data.data[i+2];
out.data[o+3]=255;
}
}

ctx.putImageData(out,0,0);

tempCroppedImage=canvas.toDataURL("image/jpeg",1);

document.getElementById('previewImg').src=tempCroppedImage;
document.getElementById('previewBox').style.display='flex';
};
}

// CONFIRM
function confirmCrop(){
pages[current]=tempCroppedImage;
document.getElementById('previewBox').style.display='none';
show();
render();
}

// CANCEL
function cancelCrop(){
tempCroppedImage=null;
document.getElementById('previewBox').style.display='none';
}

// PDF
function exportPDF(){
const {jsPDF}=window.jspdf;
let pdf=new jsPDF('p','pt','a4');

pages.forEach((p,i)=>{
pdf.addImage(p,'JPEG',0,0,595,842);
if(i<pages.length-1)pdf.addPage();
});

pdf.save("scan.pdf");
}

// INIT RENDER
function render(){
let p=document.getElementById("pages");
p.innerHTML="";
pages.forEach((s,i)=>{
let im=document.createElement("img");
im.src=s;
im.style.width="60px";
im.style.height="80px";
im.onclick=()=>{current=i;show();};
p.appendChild(im);
});
}

</script>

</body>
</html>
