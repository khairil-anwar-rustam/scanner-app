<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Scanner Pro v2</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body{
margin:0;
background:#0b1220;
color:white;
font-family:Arial;
text-align:center;
}

header{
padding:12px;
background:#111a2e;
font-weight:bold;
}

canvas{
max-width:100%;
border-radius:10px;
touch-action:none;
}

.wrap{
position:relative;
display:inline-block;
margin-top:10px;
}

.corner{
width:20px;
height:20px;
border-radius:50%;
background:#00ffd5;
position:absolute;
touch-action:none;
}

button{
margin:5px;
padding:10px;
border-radius:8px;
border:none;
background:#1f2a44;
color:white;
}
</style>
</head>

<body>

<header>📄 Scanner Pro v2 (Fixed)</header>

<input type="file" id="file" accept="image/*"/>

<div class="wrap">
<canvas id="c"></canvas>

<div class="corner" id="p0"></div>
<div class="corner" id="p1"></div>
<div class="corner" id="p2"></div>
<div class="corner" id="p3"></div>
</div>

<br>

<button onclick="warpCrop()">Crop</button>
<button onclick="rotate()">Rotate</button>
<button onclick="downloadPDF()">PDF</button>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

let img = new Image();
let angle = 0;

let pts = [
{x:40,y:40},
{x:300,y:40},
{x:300,y:400},
{x:40,y:400}
];

const corners = [...document.querySelectorAll(".corner")];

let drag = null;

// ---------- LOAD IMAGE ----------
document.getElementById("file").onchange = e=>{
const r = new FileReader();
r.onload = ev=>{
img = new Image();
img.onload = ()=>{
canvas.width = img.width;
canvas.height = img.height;
draw();
resetPts();
};
img.src = ev.target.result;
};
r.readAsDataURL(e.target.files[0]);
};

// ---------- DRAW ----------
function draw(){
ctx.clearRect(0,0,canvas.width,canvas.height);

ctx.save();
ctx.translate(canvas.width/2,canvas.height/2);
ctx.rotate(angle*Math.PI/180);
ctx.drawImage(img,-img.width/2,-img.height/2);
ctx.restore();

updateUI();
}

// ---------- CORNERS ----------
function resetPts(){
pts = [
{x:50,y:50},
{x:canvas.width-50,y:50},
{x:canvas.width-50,y:canvas.height-50},
{x:50,y:canvas.height-50}
];
updateUI();
}

function updateUI(){
pts.forEach((p,i)=>{
corners[i].style.left = p.x+"px";
corners[i].style.top = p.y+"px";
});
}

// ---------- TOUCH DRAG ----------
corners.forEach((c,i)=>{
c.addEventListener("pointerdown",()=>drag=i);

window.addEventListener("pointermove",e=>{
if(drag===null) return;

let r = canvas.getBoundingClientRect();
pts[drag] = {
x:e.clientX - r.left,
y:e.clientY - r.top
};
updateUI();
draw();
});

window.addEventListener("pointerup",()=>drag=null);
});

// ---------- ROTATE ----------
function rotate(){
angle += 90;
draw();
}

// ---------- REAL PERSPECTIVE WARP ----------
function warpCrop(){

let temp = document.createElement("canvas");
temp.width = 600;
temp.height = 800;
let t = temp.getContext("2d");

let src = ctx.getImageData(0,0,canvas.width,canvas.height);

let dst = t.createImageData(temp.width,temp.height);

function sample(x,y){
let i = (Math.floor(y)*canvas.width + Math.floor(x))*4;
return [
src.data[i]||0,
src.data[i+1]||0,
src.data[i+2]||0,
src.data[i+3]||255
];
}

// bilinear warp
for(let y=0;y<temp.height;y++){
for(let x=0;x<temp.width;x++){

let u = x/temp.width;
let v = y/temp.height;

let X =
(1-u)*(1-v)*pts[0].x +
u*(1-v)*pts[1].x +
u*v*pts[2].x +
(1-u)*v*pts[3].x;

let Y =
(1-u)*(1-v)*pts[0].y +
u*(1-v)*pts[1].y +
u*v*pts[2].y +
(1-u)*v*pts[3].y;

let c = sample(X,Y);

let i = (y*temp.width + x)*4;
dst.data[i]=c[0];
dst.data[i+1]=c[1];
dst.data[i+2]=c[2];
dst.data[i+3]=255;
}
}

t.putImageData(dst,0,0);

// replace canvas
canvas.width = temp.width;
canvas.height = temp.height;
ctx.drawImage(temp,0,0);
}

// ---------- PDF ----------
function downloadPDF(){
const { jsPDF } = window.jspdf;
let pdf = new jsPDF();

pdf.addImage(canvas.toDataURL("image/jpeg"),"JPEG",10,10,180,250);
pdf.save("scan.pdf");
}

draw();
</script>

</body>
  </html>
