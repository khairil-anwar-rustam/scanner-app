<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pro AI CamScanner</title>

<script async src="https://docs.opencv.org/4.x/opencv.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body{
margin:0;
font-family:Arial;
background:#0b1220;
color:white;
text-align:center;
overflow:hidden;
}

header{
padding:10px;
background:#111a2e;
font-weight:bold;
}

#editor{
position:relative;
width:100%;
height:65vh;
background:black;
overflow:hidden;
touch-action:none;
}

#img{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%) scale(1);
transform-origin:center;
max-width:none;
}

#overlayCanvas{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
pointer-events:none;
}

.controls{
display:flex;
flex-wrap:wrap;
gap:8px;
justify-content:center;
padding:10px;
}

button{
padding:8px 10px;
border:none;
border-radius:6px;
background:#1f2a44;
color:white;
}

button:active{background:#2e3f66;}
</style>
</head>

<body>

<header>PRO AI CamScanner (Touch + Auto Crop)</header>

<input type="file" id="file" accept="image/*">

<div id="editor">
<img id="img">
<canvas id="overlayCanvas"></canvas>
</div>

<div class="controls">
<button onclick="autoCrop()">🤖 Auto Crop</button>
<button onclick="rotate()">🔄 Rotate</button>
<button onclick="zoomIn()">➕ Zoom</button>
<button onclick="zoomOut()">➖ Zoom</button>
<button onclick="downloadImg()">⬇ Image</button>
<button onclick="downloadPDF()">📄 PDF</button>
</div>

<script>
let img = document.getElementById("img");
let file = document.getElementById("file");
let canvas = document.getElementById("overlayCanvas");

let scale = 1;
let rotation = 0;
let posX = 0;
let posY = 0;

let ctx = canvas.getContext("2d");

// ================= IMAGE LOAD =================
file.onchange = e=>{
let reader = new FileReader();
reader.onload = ev=>{
img.src = ev.target.result;
};
reader.readAsDataURL(e.target.files[0]);
};

// ================= TRANSFORM =================
function update(){
img.style.transform =
`translate(-50%,-50%) translate(${posX}px,${posY}px)
scale(${scale}) rotate(${rotation}deg)`;
}

function zoomIn(){ scale += 0.1; update(); }
function zoomOut(){ scale = Math.max(0.2, scale-0.1); update(); }
function rotate(){ rotation += 90; update(); }

// ================= TOUCH GESTURES =================
let touches = [];

document.getElementById("editor").addEventListener("touchstart", e=>{
touches = e.touches;
});

document.getElementById("editor").addEventListener("touchmove", e=>{
e.preventDefault();

if(e.touches.length == 1){
posX += e.touches[0].clientX - touches[0].clientX;
posY += e.touches[0].clientY - touches[0].clientY;
}

if(e.touches.length == 2){
let dx = e.touches[0].clientX - e.touches[1].clientX;
let dy = e.touches[0].clientY - e.touches[1].clientY;
let dist = Math.sqrt(dx*dx + dy*dy);

let dx0 = touches[0].clientX - touches[1].clientX;
let dy0 = touches[0].clientY - touches[1].clientY;
let dist0 = Math.sqrt(dx0*dx0 + dy0*dy0);

scale *= dist / dist0;
scale = Math.max(0.2, Math.min(scale, 5));
}

touches = e.touches;
update();
}, {passive:false});

// ================= MOUSE DRAG =================
let dragging=false;
let lastX, lastY;

document.getElementById("editor").addEventListener("mousedown", e=>{
dragging=true;
lastX=e.clientX;
lastY=e.clientY;
});

document.addEventListener("mousemove", e=>{
if(!dragging) return;
posX += e.clientX - lastX;
posY += e.clientY - lastY;
lastX=e.clientX;
lastY=e.clientY;
update();
});

document.addEventListener("mouseup", ()=>dragging=false);

// ================= AI AUTO CROP (OPENCV) =================
function autoCrop(){
if(!window.cv || !img.src) return alert("OpenCV loading... wait 2s");

let src = cv.imread(img);
let gray = new cv.Mat();
let blur = new cv.Mat();
let edges = new cv.Mat();

cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
cv.GaussianBlur(gray, blur, new cv.Size(5,5), 0);
cv.Canny(blur, edges, 75, 200);

// Find contours
let contours = new cv.MatVector();
let hierarchy = new cv.Mat();

cv.findContours(edges, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

let maxArea = 0;
let best = null;

for(let i=0;i<contours.size();i++){
let cnt = contours.get(i);
let area = cv.contourArea(cnt);

if(area > maxArea){
maxArea = area;
best = cnt;
}
}

// Draw result overlay
ctx.clearRect(0,0,canvas.width,canvas.height);
canvas.width = img.clientWidth;
canvas.height = img.clientHeight;

ctx.strokeStyle = "#00ffcc";
ctx.lineWidth = 3;

if(best){
let rect = cv.boundingRect(best);
ctx.strokeRect(rect.x,rect.y,rect.width,rect.height);
}

src.delete(); gray.delete(); blur.delete(); edges.delete();
contours.delete(); hierarchy.delete();
}

// ================= DOWNLOAD IMAGE =================
function downloadImg(){
let link = document.createElement("a");
link.download = "scan.png";
link.href = img.src;
link.click();
}

// ================= PDF =================
function downloadPDF(){
const { jsPDF } = window.jspdf;
let pdf = new jsPDF();

pdf.addImage(img.src, "JPEG", 10, 10, 180, 160);
pdf.save("scan.pdf");
}

// init
update();
</script>

</body>
  </html>
