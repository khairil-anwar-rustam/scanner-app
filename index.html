<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scanner Pro Resize Crop</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f172a;
  color:white;
}

.container{
  max-width:900px;
  margin:auto;
  padding:12px;
}

h1{
  text-align:center;
  font-size:18px;
}

input, button{
  width:100%;
  padding:10px;
  margin:8px 0;
  border:none;
  border-radius:8px;
}

button{
  background:#22c55e;
  font-weight:bold;
}

.editor{
  position:relative;
  background:#111827;
  border-radius:10px;
  overflow:hidden;
  display:none;
}

#img{
  width:100%;
  display:block;
}

/* crop box */
.crop{
  position:absolute;
  border:2px dashed #00ff99;
  top:50px;
  left:50px;
  width:200px;
  height:200px;
  touch-action:none;
}

/* drag area */
.move-area{
  position:absolute;
  width:100%;
  height:100%;
}

/* resize handles */
.handle{
  width:14px;
  height:14px;
  background:#00ff99;
  position:absolute;
  border-radius:50%;
}

.tl{top:-7px;left:-7px;cursor:nwse-resize;}
.tr{top:-7px;right:-7px;cursor:nesw-resize;}
.bl{bottom:-7px;left:-7px;cursor:nesw-resize;}
.br{bottom:-7px;right:-7px;cursor:nwse-resize;}

.card{
  background:#1e293b;
  padding:10px;
  margin-top:10px;
  border-radius:10px;
}

.card img{
  width:100%;
  border-radius:8px;
}

.delete{
  background:#ef4444;
  margin-top:6px;
}
</style>
</head>

<body>

<div class="container">
<h1>Scanner Pro (Resize + No Distortion PDF)</h1>

<input type="file" id="file" accept="image/*">

<div class="editor" id="editor">
  <img id="img">

  <div class="crop" id="crop">
    <div class="move-area" id="move"></div>

    <div class="handle tl" data-dir="tl"></div>
    <div class="handle tr" data-dir="tr"></div>
    <div class="handle bl" data-dir="bl"></div>
    <div class="handle br" data-dir="br"></div>
  </div>
</div>

<button onclick="addScan()">Add Scan</button>

<div id="list"></div>

<button onclick="exportPDF()">Export PDF</button>
</div>

<script>
const { jsPDF } = window.jspdf;

let scans = [];
let img = new Image();

const editor = document.getElementById("editor");
const imgEl = document.getElementById("img");
const crop = document.getElementById("crop");

let mode = null;
let startX, startY, startW, startH, startLeft, startTop;

// load image
document.getElementById("file").addEventListener("change", e=>{
  const file = e.target.files[0];
  if(!file) return;

  const reader = new FileReader();
  reader.onload = ev=>{
    img.src = ev.target.result;
    imgEl.src = ev.target.result;
    editor.style.display = "block";
  };
  reader.readAsDataURL(file);
});

// MOVE crop box
document.getElementById("move").addEventListener("pointerdown", e=>{
  mode = "move";
  startX = e.clientX;
  startY = e.clientY;
  startLeft = crop.offsetLeft;
  startTop = crop.offsetTop;
});

// RESIZE handles
document.querySelectorAll(".handle").forEach(h=>{
  h.addEventListener("pointerdown", e=>{
    mode = h.dataset.dir;
    startX = e.clientX;
    startY = e.clientY;
    startW = crop.offsetWidth;
    startH = crop.offsetHeight;
    startLeft = crop.offsetLeft;
    startTop = crop.offsetTop;
    e.stopPropagation();
  });
});

// MOVE + RESIZE logic
document.addEventListener("pointermove", e=>{
  if(!mode) return;

  const dx = e.clientX - startX;
  const dy = e.clientY - startY;

  const rect = editor.getBoundingClientRect();

  if(mode === "move"){
    let x = startLeft + dx;
    let y = startTop + dy;

    x = Math.max(0, Math.min(rect.width - crop.offsetWidth, x));
    y = Math.max(0, Math.min(rect.height - crop.offsetHeight, y));

    crop.style.left = x + "px";
    crop.style.top = y + "px";
  }

  if(mode === "tl"){
    crop.style.width = startW - dx + "px";
    crop.style.height = startH - dy + "px";
    crop.style.left = startLeft + dx + "px";
    crop.style.top = startTop + dy + "px";
  }

  if(mode === "tr"){
    crop.style.width = startW + dx + "px";
    crop.style.height = startH - dy + "px";
    crop.style.top = startTop + dy + "px";
  }

  if(mode === "bl"){
    crop.style.width = startW - dx + "px";
    crop.style.height = startH + dy + "px";
    crop.style.left = startLeft + dx + "px";
  }

  if(mode === "br"){
    crop.style.width = startW + dx + "px";
    crop.style.height = startH + dy + "px";
  }
});

document.addEventListener("pointerup", ()=>{
  mode = null;
});

// CROPPING (correct scale, no distortion)
function cropImage(){
  const canvas = document.createElement("canvas");
  const ctx = canvas.getContext("2d");

  const imgRect = imgEl.getBoundingClientRect();
  const cropRect = crop.getBoundingClientRect();

  const scaleX = img.width / imgRect.width;
  const scaleY = img.height / imgRect.height;

  const x = (cropRect.left - imgRect.left) * scaleX;
  const y = (cropRect.top - imgRect.top) * scaleY;
  const w = cropRect.width * scaleX;
  const h = cropRect.height * scaleY;

  canvas.width = w;
  canvas.height = h;

  ctx.drawImage(img, x, y, w, h, 0, 0, w, h);

  return canvas.toDataURL("image/jpeg", 0.95);
}

// add scan
function addScan(){
  scans.push(cropImage());
  render();

  editor.style.display = "none";
  document.getElementById("file").value = "";
}

// render
function render(){
  const list = document.getElementById("list");
  list.innerHTML = "";

  scans.forEach((s,i)=>{
    const div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <div>Page ${i+1}</div>
      <img src="${s}">
      <button class="delete" onclick="del(${i})">Delete</button>
    `;

    list.appendChild(div);
  });
}

function del(i){
  scans.splice(i,1);
  render();
}

// PDF EXPORT (NO DISTORTION FIXED)
function exportPDF(){
  if(scans.length === 0){
    alert("No scans");
    return;
  }

  const doc = new jsPDF();

  scans.forEach((img,i)=>{
    if(i>0) doc.addPage();

    const pageW = 190;
    const pageH = 277;

    const image = new Image();
    image.src = img;

    image.onload = ()=>{

      const ratio = image.width / image.height;

      let w = pageW;
      let h = w / ratio;

      if(h > pageH){
        h = pageH;
        w = h * ratio;
      }

      doc.addImage(img,"JPEG",10,10,w,h);

      if(i === scans.length-1){
        doc.save("scan.pdf");
      }
    };
  });
}
</script>

</body>
  </html>
