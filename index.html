<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scanner Ultra Pro AI FIXED+</title>

<style>
body{
margin:0;
font-family:Arial;
background:#0b1220;
color:white;
text-align:center;
}

header{
padding:12px;
background:#111a2e;
font-weight:bold;
}

#controls{
display:flex;
flex-wrap:wrap;
gap:8px;
justify-content:center;
padding:10px;
background:#0f172a;
}

button,input{
padding:10px;
border:0;
border-radius:8px;
font-weight:bold;
}

button{background:#22c55e;cursor:pointer;}

#editor{
position:relative;
height:60vh;
margin:10px;
background:black;
overflow:hidden;
border-radius:10px;
}

#img{
width:100%;
height:100%;
object-fit:contain;
touch-action:none;
position:absolute;
top:0;
left:0;
}

#overlay{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
}

.corner{
width:18px;
height:18px;
background:#22c55e;
border:2px solid white;
border-radius:50%;
position:absolute;
transform:translate(-50%,-50%);
touch-action:none;
}

#pages{
display:flex;
overflow-x:auto;
padding:10px;
}

.page{
width:80px;
height:100px;
object-fit:cover;
border:2px solid #22c55e;
margin:5px;
}

canvas{display:none;}
</style>
</head>

<body>

<header>📄 Scanner ULTRA PRO AI (CamScanner Corners FIXED)</header>

<div id="controls">
<input type="file" id="fileInput" accept="image/*">

<button onclick="oneClickScan()">🚀 Auto Scan</button>
<button onclick="addPage()">Add Page</button>
<button onclick="exportPDF()">Export PDF</button>
<button onclick="runOCR()">OCR</button>
</div>

<div id="editor">
<img id="img">

<div id="overlay">
  <div class="corner" id="c1"></div>
  <div class="corner" id="c2"></div>
  <div class="corner" id="c3"></div>
  <div class="corner" id="c4"></div>
</div>

</div>

<div id="pages"></div>
<canvas id="canvas"></canvas>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://docs.opencv.org/4.x/opencv.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<script>

let img = document.getElementById("img");
let fileInput = document.getElementById("fileInput");
let canvas = document.getElementById("canvas");
let ctx = canvas.getContext("2d");

let pages = [];
let cvReady = false;

/* Corners */
let corners = [
{ x: 50, y: 50 },
{ x: 250, y: 50 },
{ x: 250, y: 250 },
{ x: 50, y: 250 }
];

let activeCorner = null;

/* OpenCV init */
cv['onRuntimeInitialized'] = () => {
cvReady = true;
console.log("OpenCV READY ✔");
};

/* Load image */
fileInput.onchange = e=>{
let file = e.target.files[0];
let reader = new FileReader();

reader.onload = ev=>{
img.src = ev.target.result;
};

reader.readAsDataURL(file);
};

/* reset corners on load */
img.onload = ()=>{
setTimeout(()=>{
let box = document.getElementById("editor").getBoundingClientRect();

corners = [
{ x: 20, y: 20 },
{ x: box.width - 20, y: 20 },
{ x: box.width - 20, y: box.height - 20 },
{ x: 20, y: box.height - 20 }
];

renderCorners();
},200);
};

/* render corners */
function renderCorners(){
let ids = ["c1","c2","c3","c4"];

corners.forEach((c,i)=>{
let el = document.getElementById(ids[i]);
el.style.left = c.x + "px";
el.style.top = c.y + "px";
});
}

renderCorners();

/* drag corners */
["c1","c2","c3","c4"].forEach((id,index)=>{
let el = document.getElementById(id);

el.addEventListener("pointerdown",()=>{
activeCorner = index;
});

window.addEventListener("pointermove",(e)=>{
if(activeCorner === null) return;

let rect = document.getElementById("editor").getBoundingClientRect();

corners[activeCorner].x = e.clientX - rect.left;
corners[activeCorner].y = e.clientY - rect.top;

renderCorners();
});

window.addEventListener("pointerup",()=>{
activeCorner = null;
});
});

/* AUTO SCAN using corners */
function oneClickScan(){

if(!cvReady){
alert("OpenCV still loading...");
return;
}

let src = cv.imread(img);
let dst = new cv.Mat();

let srcPts = cv.matFromArray(4,1,cv.CV_32FC2,[
corners[0].x, corners[0].y,
corners[1].x, corners[1].y,
corners[2].x, corners[2].y,
corners[3].x, corners[3].y
]);

let width = 600;
let height = 800;

let dstPts = cv.matFromArray(4,1,cv.CV_32FC2,[
0,0,
width,0,
width,height,
0,height
]);

let M = cv.getPerspectiveTransform(srcPts, dstPts);

cv.warpPerspective(src, dst, M, new cv.Size(width,height));

cv.imshow(canvas, dst);

img.src = canvas.toDataURL("image/jpeg",1.0);

/* cleanup */
src.delete(); dst.delete(); M.delete();
srcPts.delete(); dstPts.delete();

alert("Scan Done ✔");
}

/* add page */
function addPage(){
pages.push(img.src);
renderPages();
}

function renderPages(){
let box = document.getElementById("pages");
box.innerHTML = "";

pages.forEach(p=>{
let im = document.createElement("img");
im.src = p;
im.className = "page";
box.appendChild(im);
});
}

/* OCR */
async function runOCR(){
let result = await Tesseract.recognize(img.src,'eng');
alert(result.data.text);
}

/* PDF export */
async function exportPDF(){
const { jsPDF } = window.jspdf;
let pdf = new jsPDF();

let all = [img.src, ...pages];

for(let i=0;i<all.length;i++){
await new Promise(res=>{
let temp = new Image();
temp.src = all[i];

temp.onload = ()=>{
canvas.width = temp.width;
canvas.height = temp.height;
ctx.drawImage(temp,0,0);

pdf.addImage(canvas.toDataURL("image/jpeg"),"JPEG",10,10,180,250);

if(i !== all.length-1) pdf.addPage();

res();
};
});
}

pdf.save("scan.pdf");
}

</script>

</body>
   </html>
