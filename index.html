<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>GitHub Scanner Pro</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body{
margin:0;
font-family:Arial;
background:#0b1220;
color:white;
text-align:center;
}

header{
padding:12px;
background:#111a2e;
font-weight:bold;
}

#container{
padding:10px;
}

#canvasWrap{
position:relative;
display:inline-block;
max-width:100%;
touch-action:none;
}

canvas{
max-width:100%;
border-radius:10px;
background:#000;
}

.corner{
position:absolute;
width:18px;
height:18px;
background:#00ffd5;
border-radius:50%;
touch-action:none;
}

button{
margin:6px;
padding:10px 14px;
border:none;
border-radius:8px;
background:#1f2a44;
color:white;
font-weight:bold;
}

button:active{
transform:scale(0.97);
}

input{
margin:10px;
}
</style>
</head>

<body>

<header>📄 GitHub Scanner Pro</header>

<div id="container">

<input type="file" id="file" accept="image/*">

<br>

<div id="canvasWrap">
<canvas id="canvas"></canvas>

<div class="corner" id="c1"></div>
<div class="corner" id="c2"></div>
<div class="corner" id="c3"></div>
<div class="corner" id="c4"></div>

</div>

<br>

<button onclick="rotate()">Rotate</button>
<button onclick="enhance()">Flatten</button>
<button onclick="crop()">Crop</button>
<button onclick="exportPDF()">Export PDF</button>

</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let img = new Image();
let angle = 0;

let points = [
{ x: 50, y: 50 },
{ x: 250, y: 50 },
{ x: 250, y: 250 },
{ x: 50, y: 250 }
];

let activePoint = null;

const corners = [
document.getElementById("c1"),
document.getElementById("c2"),
document.getElementById("c3"),
document.getElementById("c4")
];

// Load image
document.getElementById("file").onchange = function(e){
const reader = new FileReader();
reader.onload = function(event){
img = new Image();
img.onload = function(){
canvas.width = img.width;
canvas.height = img.height;
drawImage();
resetCorners();
}
img.src = event.target.result;
}
reader.readAsDataURL(e.target.files[0]);
};

// Draw image
function drawImage(){
ctx.clearRect(0,0,canvas.width,canvas.height);
ctx.save();
ctx.translate(canvas.width/2, canvas.height/2);
ctx.rotate(angle * Math.PI/180);
ctx.drawImage(img, -img.width/2, -img.height/2);
ctx.restore();
updateCorners();
}

// Reset corners
function resetCorners(){
points = [
{ x: 50, y: 50 },
{ x: canvas.width-50, y: 50 },
{ x: canvas.width-50, y: canvas.height-50 },
{ x: 50, y: canvas.height-50 }
];
updateCorners();
}

// Update UI corners
function updateCorners(){
points.forEach((p,i)=>{
corners[i].style.left = p.x + "px";
corners[i].style.top = p.y + "px";
});
}

// Drag logic (touch + mouse)
corners.forEach((corner,i)=>{
corner.onmousedown = startDrag;
corner.ontouchstart = startDrag;

function startDrag(e){
activePoint = i;
document.onmousemove = move;
document.ontouchmove = move;
document.onmouseup = end;
document.ontouchend = end;
}

function move(e){
let rect = canvas.getBoundingClientRect();
let x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
let y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;

points[activePoint] = { x, y };
updateCorners();
}

function end(){
document.onmousemove = null;
document.ontouchmove = null;
}
});

// Rotate image
function rotate(){
angle += 90;
drawImage();
}

// Simple flatten (contrast boost)
function enhance(){
let imageData = ctx.getImageData(0,0,canvas.width,canvas.height);
let data = imageData.data;

for(let i=0;i<data.length;i+=4){
data[i] = Math.min(255, data[i]*1.2);
data[i+1] = Math.min(255, data[i+1]*1.2);
data[i+2] = Math.min(255, data[i+2]*1.2);
}

ctx.putImageData(imageData,0,0);
}

// Perspective crop (simple warp)
function crop(){
let w = canvas.width;
let h = canvas.height;

let temp = document.createElement("canvas");
temp.width = w;
temp.height = h;
let tctx = temp.getContext("2d");

tctx.drawImage(canvas,0,0);

ctx.clearRect(0,0,w,h);

let [p1,p2,p3,p4] = points;

let steps = 50;

for(let i=0;i<steps;i++){
for(let j=0;j<steps;j++){

let u = i/steps;
let v = j/steps;

let x = (1-u)*(1-v)*p1.x + u*(1-v)*p2.x + u*v*p3.x + (1-u)*v*p4.x;
let y = (1-u)*(1-v)*p1.y + u*(1-v)*p2.y + u*v*p3.y + (1-u)*v*p4.y;

let color = tctx.getImageData(x,y,1,1).data;

ctx.fillStyle = `rgb(${color[0]},${color[1]},${color[2]})`;
ctx.fillRect(i*(w/steps), j*(h/steps), w/steps, h/steps);
}
}
}

// Export PDF
function exportPDF(){
const { jsPDF } = window.jspdf;
let pdf = new jsPDF();

let imgData = canvas.toDataURL("image/jpeg",1.0);

pdf.addImage(imgData,"JPEG",10,10,180,250);
pdf.save("scan.pdf");
}

// init corners position after load
setTimeout(updateCorners,500);
</script>

</body>
  </html>
