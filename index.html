<!-- ===============================
CamScanner CLONE PRO UI (GitHub Pages)
FULL VERSION

FEATURES:
- Live camera preview
- Live document scan overlay (edge box)
- Draggable 4-point corners (manual correction)
- Real perspective transform (OpenCV.js)
- Multi-page scanner
- Page thumbnails
- Black & white filter
- PDF export (multi-page)
- Fully static (.github.io compatible)
=============================== -->

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CamScanner Clone Pro</title>

<style>
body{margin:0;font-family:Arial;background:#0b1220;color:white;text-align:center}
header{padding:10px;background:#111827}

.container{
  position:relative;
  width:100%;
  max-width:500px;
  margin:auto;
}

video{
  width:100%;
  border-radius:10px;
}

canvas{
  position:absolute;
  left:0;
  top:0;
  width:100%;
  height:100%;
}

button{padding:10px;margin:4px;border:none;border-radius:8px;background:#2563eb;color:white}
button:hover{background:#1d4ed8}

#pages{display:flex;overflow-x:auto;gap:8px;padding:10px}
.page-thumb{width:60px;height:80px;object-fit:cover;border:2px solid #334155;border-radius:6px;cursor:pointer}
.page-thumb.active{border-color:#22c55e}

.corner{
  position:absolute;
  width:18px;
  height:18px;
  background:#22c55e;
  border-radius:50%;
  transform:translate(-50%,-50%);
  touch-action:none;
}

</style>
</head>
<body>

<header>📄 CamScanner Clone PRO</header>

<div class="container">
<video id="video" autoplay></video>
<canvas id="overlay"></canvas>
</div>

<div>
<button onclick="startCamera()">Camera</button>
<button onclick="capture()">Capture</button>
<button onclick="applyBW()">B/W</button>
<button onclick="exportPDF()">PDF</button>
</div>

<h3>Pages</h3>
<div id="pages"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script async src="https://docs.opencv.org/4.x/opencv.js"></script>

<script>
let video=document.getElementById('video');
let overlay=document.getElementById('overlay');
let ctx=overlay.getContext('2d');

let pages=[];
let current=0;

// 4 draggable points
let pts=[
  {x:50,y:50},{x:400,y:50},{x:400,y:500},{x:50,y:500}
];
let dragging=null;

function startCamera(){
 navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}})
 .then(s=>video.srcObject=s);
 requestAnimationFrame(drawOverlay);
}

// ---------------- LIVE OVERLAY ----------------
function drawOverlay(){
 overlay.width=video.clientWidth;
 overlay.height=video.clientHeight;

 ctx.clearRect(0,0,overlay.width,overlay.height);

 ctx.strokeStyle="lime";
 ctx.lineWidth=2;
 ctx.beginPath();
 ctx.moveTo(pts[0].x,pts[0].y);
 for(let i=1;i<4;i++) ctx.lineTo(pts[i].x,pts[i].y);
 ctx.closePath();
 ctx.stroke();

 pts.forEach((p,i)=>{
  ctx.fillStyle="red";
  ctx.beginPath();
  ctx.arc(p.x,p.y,8,0,Math.PI*2);
  ctx.fill();
 });

 requestAnimationFrame(drawOverlay);
}

// ---------------- DRAG CORNERS ----------------
overlay.addEventListener('touchstart',startDrag);
overlay.addEventListener('touchmove',drag);
overlay.addEventListener('touchend',()=>dragging=null);

overlay.addEventListener('mousedown',startDrag);
overlay.addEventListener('mousemove',drag);
overlay.addEventListener('mouseup',()=>dragging=null);

function getPos(e){
 let r=overlay.getBoundingClientRect();
 let x=(e.touches?e.touches[0].clientX:e.clientX)-r.left;
 let y=(e.touches?e.touches[0].clientY:e.clientY)-r.top;
 return {x,y};
}

function startDrag(e){
 let p=getPos(e);
 pts.forEach(pt=>{
  if(Math.hypot(pt.x-p.x,pt.y-p.y)<20) dragging=pt;
 });
}

function drag(e){
 if(!dragging) return;
 let p=getPos(e);
 dragging.x=p.x;
 dragging.y=p.y;
}

// ---------------- CAPTURE + WARP ----------------
function capture(){
 let c=document.createElement('canvas');
 c.width=video.videoWidth;
 c.height=video.videoHeight;
 let cx=c.getContext('2d');
 cx.drawImage(video,0,0);

 let img=new Image();
 img.src=c.toDataURL();
 img.onload=()=>{
  let warped=perspectiveWarp(img);
  pages.push(warped);
  current=pages.length-1;
  renderPages();
 };
}

// ---------------- PERSPECTIVE WARP ----------------
function perspectiveWarp(img){
 let c=document.createElement('canvas');
 c.width=img.width;
 c.height=img.height;
 let cx=c.getContext('2d');
 cx.drawImage(img,0,0);

 let src=cv.imread(c);
 let dst=new cv.Mat();

 let s=pts.map(p=>[p.x*(img.width/overlay.width),p.y*(img.height/overlay.height)]);

 let srcTri=cv.matFromArray(4,1,cv.CV_32FC2,[
  s[0][0],s[0][1],
  s[1][0],s[1][1],
  s[2][0],s[2][1],
  s[3][0],s[3][1]
 ]);

 let dsize=new cv.Size(img.width,img.height);
 let dstTri=cv.matFromArray(4,1,cv.CV_32FC2,[
  0,0,
  img.width,0,
  img.width,img.height,
  0,img.height
 ]);

 let M=cv.getPerspectiveTransform(srcTri,dstTri);
 cv.warpPerspective(src,dst,M,dsize);

 cv.imshow(c,dst);

 src.delete();dst.delete();M.delete();srcTri.delete();dstTri.delete();

 return c.toDataURL();
}

// ---------------- MULTI PAGE ----------------
function renderPages(){
 let p=document.getElementById('pages');
 p.innerHTML='';
 pages.forEach((img,i)=>{
  let im=document.createElement('img');
  im.src=img;
  im.className='page-thumb'+(i===current?' active':'');
  im.onclick=()=>{current=i;};
  p.appendChild(im);
 });
}

// ---------------- FILTER ----------------
function applyBW(){
 let img=new Image();
 img.src=pages[current];
 img.onload=()=>{
  let c=document.createElement('canvas');
  c.width=img.width;c.height=img.height;
  let cx=c.getContext('2d');
  cx.drawImage(img,0,0);
  let d=cx.getImageData(0,0,c.width,c.height);
  for(let i=0;i<d.data.length;i+=4){
   let g=(d.data[i]+d.data[i+1]+d.data[i+2])/3;
   d.data[i]=d.data[i+1]=d.data[i+2]=g;
  }
  cx.putImageData(d,0,0);
  pages[current]=c.toDataURL();
  renderPages();
 };
}

// ---------------- PDF ----------------
function exportPDF(){
 const {jsPDF}=window.jspdf;
 let pdf=new jsPDF();
 pages.forEach((img,i)=>{
  if(i>0) pdf.addPage();
  pdf.addImage(img,'PNG',10,10,180,160);
 });
 pdf.save('scan.pdf');
}

</script>

</body>
  </html>
