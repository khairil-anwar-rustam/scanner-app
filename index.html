<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pro Scanner FIXED 4-Corner</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f172a;
  color:white;
}

.container{
  max-width:900px;
  margin:auto;
  padding:12px;
}

h1{
  text-align:center;
  font-size:18px;
}

input, button{
  width:100%;
  padding:10px;
  margin:8px 0;
  border:none;
  border-radius:8px;
}

button{
  background:#22c55e;
  font-weight:bold;
}

.editor{
  position:relative;
  background:#111827;
  border-radius:10px;
  overflow:hidden;
  touch-action:none;
}

#img{
  width:100%;
  display:block;
  pointer-events:none;
}

.point{
  width:18px;
  height:18px;
  background:#00ff99;
  border-radius:50%;
  position:absolute;
  transform:translate(-50%,-50%);
  cursor:pointer;
  border:2px solid black;
}

.list .card{
  background:#1e293b;
  padding:10px;
  margin-top:10px;
  border-radius:10px;
}

.card img{
  width:100%;
  border-radius:8px;
}

.delete{
  background:#ef4444;
  margin-top:6px;
}
</style>
</head>

<body>

<div class="container">
<h1>Scanner Pro FIXED (Drag Working)</h1>

<input type="file" id="file" accept="image/*">

<div class="editor" id="editor" style="display:none;">
  <img id="img">

  <div class="point" id="p1"></div>
  <div class="point" id="p2"></div>
  <div class="point" id="p3"></div>
  <div class="point" id="p4"></div>
</div>

<button onclick="addScan()">Add Scan</button>

<div id="list"></div>

<button onclick="exportPDF()">Export PDF</button>
</div>

<script>
const { jsPDF } = window.jspdf;

let img = new Image();
let scans = [];

const editor = document.getElementById('editor');
const imgEl = document.getElementById('img');

const points = [
  document.getElementById('p1'),
  document.getElementById('p2'),
  document.getElementById('p3'),
  document.getElementById('p4')
];

let activePoint = null;

// 📌 Load image
document.getElementById('file').addEventListener('change', e=>{
  const file = e.target.files[0];
  if(!file) return;

  const reader = new FileReader();
  reader.onload = ev=>{
    img.src = ev.target.result;
    imgEl.src = ev.target.result;
    editor.style.display = 'block';
  };
  reader.readAsDataURL(file);
});

// 📌 Init points AFTER image load
img.onload = ()=>{
  const rect = editor.getBoundingClientRect();

  setPoint(points[0], 40, 40);
  setPoint(points[1], rect.width-40, 40);
  setPoint(points[2], rect.width-40, rect.height-40);
  setPoint(points[3], 40, rect.height-40);
};

function setPoint(el,x,y){
  el.style.left = x + "px";
  el.style.top = y + "px";
}

// ============================
// 🔥 FIXED DRAG SYSTEM
// ============================

// pointer down (mouse + touch)
points.forEach(p=>{
  p.addEventListener("pointerdown",(e)=>{
    activePoint = p;
    e.preventDefault();
  });
});

// move anywhere
document.addEventListener("pointermove",(e)=>{
  if(!activePoint) return;

  const rect = editor.getBoundingClientRect();

  let x = e.clientX - rect.left;
  let y = e.clientY - rect.top;

  // clamp inside editor
  x = Math.max(0, Math.min(rect.width, x));
  y = Math.max(0, Math.min(rect.height, y));

  activePoint.style.left = x + "px";
  activePoint.style.top = y + "px";
});

// release
document.addEventListener("pointerup",()=>{
  activePoint = null;
});

// ============================
// Perspective Warp (simple but stable)
// ============================
function warp(src, pts, w, h){
  const canvas = document.createElement("canvas");
  const ctx = canvas.getContext("2d");

  canvas.width = w;
  canvas.height = h;

  const imgObj = new Image();
  imgObj.src = src;

  return new Promise(res=>{
    imgObj.onload = ()=>{

      const [p1,p2,p3,p4] = pts;
      const steps = 120;

      for(let i=0;i<steps;i++){
        for(let j=0;j<steps;j++){

          const u = i/steps;
          const v = j/steps;

          const topX = p1.x + (p2.x - p1.x)*u;
          const topY = p1.y + (p2.y - p1.y)*u;

          const botX = p4.x + (p3.x - p4.x)*u;
          const botY = p4.y + (p3.y - p4.y)*u;

          const x = topX + (botX - topX)*v;
          const y = topY + (botY - topY)*v;

          const sx = (x/editor.clientWidth) * imgObj.width;
          const sy = (y/editor.clientHeight) * imgObj.height;

          const dx = u*w;
          const dy = v*h;

          ctx.drawImage(imgObj, sx, sy, 2, 2, dx, dy, 2, 2);
        }
      }

      res(canvas.toDataURL("image/jpeg",0.95));
    };
  });
}

// get points
function getPoints(){
  const rect = editor.getBoundingClientRect();

  return points.map(p=>({
    x: parseFloat(p.style.left)/rect.width * editor.clientWidth,
    y: parseFloat(p.style.top)/rect.height * editor.clientHeight
  }));
}

// add scan
async function addScan(){
  const warped = await warp(img.src, getPoints(), 1000, 1400);
  scans.push(warped);
  render();

  editor.style.display = "none";
  document.getElementById("file").value = "";
}

// render
function render(){
  const list = document.getElementById("list");
  list.innerHTML = "";

  scans.forEach((s,i)=>{
    const div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <div>Page ${i+1}</div>
      <img src="${s}">
      <button class="delete" onclick="deleteScan(${i})">Delete</button>
    `;

    list.appendChild(div);
  });
}

// delete
function deleteScan(i){
  scans.splice(i,1);
  render();
}

// export PDF
function exportPDF(){
  const doc = new jsPDF();

  scans.forEach((s,i)=>{
    if(i!==0) doc.addPage();
    doc.addImage(s,"JPEG",10,10,190,260);
  });

  doc.save("scan.pdf");
}
</script>

</body>
  </html>
